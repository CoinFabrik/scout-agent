[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68", "wheel"]

[project]
dependencies = [
    "deepagents>=0.4.10",
    "langchain-anthropic>=1.3.4",
    "langchain-core>=1.2.19",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.11",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "tree_sitter>=0.25.2",
    "tree_sitter_rust>=0.24.0",
]
description = "Supervisor-worker Soroban auditing agent"
name = "scout-agent"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pytest-cov>=5.0.0", "pytest>=8.2.0"]

[project.scripts]
scout-agent = "scout_agent.cli.main:main"

[tool.setuptools.packages.find]
include = ["scout_agent*"]

[tool.setuptools.package-data]
scout_agent = [
    "audit/prompts/*.md",
    "audit/prompts/*/*.md",
    "audit/prompts/*/*/*.md",
    "audit/prompts/*/*/*/*.md",
    "audit/prompts/*/*/*/*/*.md",
    "extract/prompts/*.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
