[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68", "wheel"]

[project]
dependencies = [
    "deepagents>=0.4.5",
    "langchain-anthropic>=1.3.4",
    "langchain-core>=1.2.16",
    "langchain-google-genai>=4.2.1",
    "langchain-openai>=1.1.10",
    "langgraph>=1.0.10",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
    "tree_sitter>=0.25.2",
    "tree_sitter_rust>=0.24.0",
]
description = "Supervisor-worker Soroban auditing agent"
name = "scout-agent"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = ["pytest-cov>=5.0.0", "pytest>=8.2.0"]

[project.scripts]
scout-agent = "scout_agent.app.main:main"

[tool.setuptools.packages.find]
include = ["scout_agent*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
