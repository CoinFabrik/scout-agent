      pool/src/pool/interest.rs::calc_accrual:
        time_dependent: Reads e.ledger().timestamp() and computes delta_time from
          last_time; panics with InternalError if delta_time < 1. The accrual amount
          is proportional to elapsed time scaled against SECONDS_PER_YEAR.
        sentinel_values: ir_mod is clamped to a max of 10 * SCALAR_7 and a min of
