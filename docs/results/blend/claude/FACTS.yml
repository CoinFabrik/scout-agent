  backstop/src/backstop/pool.rs:
    content_sha256: 663b12ebde3d878653dfd4c2fcce72ce3d957cda027544890e3d7998f54d253c
    functions:
      backstop/src/backstop/pool.rs::load_pool_backstop_data:
        sentinel_values: Returns zeroed PoolBackstopData (tokens=0, blnd=0, usdc=0)
          when pool_balance.tokens <= 0; q4w_pct is 0 when pool_balance.shares <=
          0.
      backstop/src/backstop/pool.rs::require_is_from_pool_factory:
        authorization: Verification is skipped if balance != 0 (assumes previously
          verified); when balance == 0, queries the pool factory to confirm the address
          is a deployed pool, panicking with BackstopError::NotPool if not.
        sentinel_values: A balance of 0 is the sentinel indicating the pool has not
          been initialized and must be verified against the pool factory.
      backstop/src/backstop/pool.rs::require_pool_above_threshold:
        sentinel_values: Uses a hardcoded threshold_pc of 1e25 (100k^5); balances
          are floored to full units by dividing by SCALAR_7; uses saturating_mul to
          avoid i128 overflow.
      backstop/src/backstop/pool.rs::PoolBalance::convert_to_shares:
        sentinel_values: Returns tokens directly (1:1) when self.shares == 0, treating
          zero total shares as the uninitialized/empty pool case.
      backstop/src/backstop/pool.rs::PoolBalance::convert_to_tokens:
        sentinel_values: Returns shares directly (1:1) when self.shares == 0, treating
          zero total shares as the uninitialized/empty pool case.
      backstop/src/backstop/pool.rs::PoolBalance::non_queued_tokens: {}
      backstop/src/backstop/pool.rs::PoolBalance::deposit: {}
      backstop/src/backstop/pool.rs::PoolBalance::withdraw:
        sentinel_values: Panics with BackstopError::InsufficientFunds if tokens >
          self.tokens, shares > self.shares, or shares > self.q4w.
      backstop/src/backstop/pool.rs::PoolBalance::queue_for_withdraw: {}
      backstop/src/backstop/pool.rs::PoolBalance::dequeue_q4w:
        sentinel_values: Panics with BackstopError::InsufficientFunds if shares >
          self.q4w.
  backstop/src/backstop/user.rs:
    content_sha256: 6bfa489c54e960df098368279de980e8fd2a2d5d3d88d077fe4cb2de142a0311
    functions:
      backstop/src/backstop/user.rs::UserBalance::env_default:
        sentinel_values: Returns a UserBalance with shares set to 0 and an empty q4w
          Vec.
      backstop/src/backstop/user.rs::UserBalance::add_shares: {}
      backstop/src/backstop/user.rs::UserBalance::queue_shares_for_withdrawal:
        vector_params: Pushes a new Q4W entry to the back of self.q4w; panics with
          TooManyQ4WEntries if q4w length >= MAX_Q4W_SIZE.
        time_dependent: Sets the new Q4W expiration to e.ledger().timestamp() + Q4W_LOCK_TIME.
        sentinel_values: Panics with BalanceError if to_q exceeds self.shares; panics
          with TooManyQ4WEntries if queue is full.
      backstop/src/backstop/user.rs::UserBalance::withdraw_shares:
        vector_params: Iterates and pops from the front of self.q4w, partially consuming
          or fully removing Q4W entries to satisfy the withdrawal amount.
        time_dependent: Only processes Q4W entries whose exp <= e.ledger().timestamp();
          panics with NotExpired if an unexpired entry is encountered.
        sentinel_values: Panics with NotExpired if a Q4W entry has not expired; panics
          with BalanceError if remaining left_to_withdraw > 0 after processing all
          entries.
      backstop/src/backstop/user.rs::UserBalance::dequeue_shares:
        vector_params: Iterates and pops from the back of self.q4w (most recently
          queued first), partially consuming or fully removing Q4W entries to satisfy
          the dequeue amount.
        sentinel_values: Panics with BalanceError if remaining left_to_dequeue > 0
          after processing all Q4W entries.
