  pool/src/auctions/user_liquidation_auction.rs:
    content_sha256: 70e19041892917224ac2b1f8f39046fdae2e88a94b57c3ec02ea6f39a5aa48f4
    functions:
      pool/src/auctions/user_liquidation_auction.rs::create_user_liq_auction_data:
        authorization: No direct auth check; panics if user is the current contract
          or the backstop address, and panics if an auction is already in progress
          for the user.
        vector_params: bid (Vec<Address>) specifies liability asset addresses and
          lot (Vec<Address>) specifies collateral asset addresses; their combined
          length must not exceed pool.config.max_positions; each must resolve to existing
          user positions or the call panics.
        time_dependent: Uses e.ledger().sequence() + 1 to set the auction block; percent
          is checked at 95% threshold for full liquidation logic; post-liquidation
          health factor must be between 1.03 and 1.15 (non-full) or under 1.15 at
          95% (full).
        sentinel_values: percent must be >0 and <=100, panics with InvalidLiquidation
          otherwise; percent >95 with all positions triggers full liquidation mode
          (defaults to 100%); est_withdrawn_collateral_pct is clamped to scalar if
          it exceeds it; health factor thresholds are 1_1500000 (upper) and 1_0300000
          (lower).
      pool/src/auctions/user_liquidation_auction.rs::fill_user_liq_auction:
        authorization: No authorization checks within this function; caller is responsible
          for ensuring proper access control.
        vector_params: No vector params; auction_data.lot and auction_data.bid (Maps)
          are cloned and passed to rm_positions (from user) and add_positions (to
          filler_state).
        time_dependent: No time or block-dependent logic within this function.
        sentinel_values: No sentinel values; delegates position transfer logic to
          User::rm_positions and User::add_positions.
