      pool/src/pool/config.rs::initialize_reserve:
        time_dependent: Sets last_time to e.ledger().timestamp() when initializing
          new reserve data.
        sentinel_values: New reserves are initialized with b_rate=SCALAR_12, d_rate=SCALAR_12,
          ir_mod=SCALAR_7, d_supply=0, b_supply=0, backstop_credit=0; IR modifier
          reset to SCALAR_7 if IR parameters change; panics with InvalidReserveMetadata
          if decimals change on existing reserve.
      pool/src/pool/config.rs::require_valid_reserve_metadata:
        sentinel_values: Panics with InvalidReserveMetadata if decimals > 18, c_factor
