          <= util, r_base >= 1_0000000 or r_base < 0_0001000, r_one > r_two or r_two
          > r_three, or reactivity > 0_0001000.
      pool/src/pool/config.rs::require_valid_pool_config:
        sentinel_values: Panics with InvalidPoolConfigArgs if bstop_rate >= SCALAR_7,
          max_positions < 2 or > 2*MAX_RESERVES, or min_collateral < 0.
