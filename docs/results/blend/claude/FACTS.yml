  pool/src/emissions/distributor.rs:
    content_sha256: e80752b64a9e2cf062d7742b834c0a6ca7740707bd16e77b00814a35bf563c07
    functions:
      pool/src/emissions/distributor.rs::execute_claim:
        authorization: No explicit auth check in this function; caller must ensure
          authorization before invoking.
        vector_params: reserve_token_ids is a Vec<u32> iterated to identify each reserve
          token (even=dToken liabilities, odd=bToken supply) for which to claim emissions.
        time_dependent: Indirectly time-dependent via update_emission_data which uses
          e.ledger().timestamp() to compute accrued emissions.
        sentinel_values: Returns 0 if no emissions are claimable; panics with PoolError::BadRequest
          if a reserve_token_id maps to a None reserve address or an unexpected modulo
          result.
      pool/src/emissions/distributor.rs::update_emissions:
        authorization: No authorization check; intended to be called internally before
          supply changes.
        time_dependent: Indirectly time-dependent via update_emission_data which uses
          e.ledger().timestamp() to advance the emission index.
        sentinel_values: Returns nothing (void); silently does nothing if update_emission_data
          returns None (no emission data exists).
      pool/src/emissions/distributor.rs::claim_emissions:
        authorization: Private function; no authorization check performed.
        time_dependent: Indirectly time-dependent via update_emission_data which uses
          e.ledger().timestamp() to compute the emission index.
        sentinel_values: Returns 0 if update_emission_data returns None (no emission
          data exists for the reserve token).
      pool/src/emissions/distributor.rs::update_emission_data:
        authorization: pub(super) visibility; no authorization check performed.
        time_dependent: Uses e.ledger().timestamp() to compute elapsed time since
          last update, capped at the emission expiration timestamp, to calculate additional
          emission index.
        sentinel_values: Returns None if no reserve emission data exists in storage;
          returns early with unchanged data if last_time >= expiration, timestamp
          == last_time, eps == 0, or supply == 0.
      pool/src/emissions/distributor.rs::update_user_emissions:
        authorization: Private function; no authorization check performed.
        sentinel_values: Returns 0 when claim is false or when user_data.index equals
          res_emis_data.index and claim is false; initializes accrued to 0 for first-time
          users with zero balance; panics via require_nonnegative if delta_index is
          negative.
      pool/src/emissions/distributor.rs::set_user_emissions:
        authorization: Private function; no authorization check performed.
        sentinel_values: When claim is true, stores accrued as 0 in UserEmissionData
          and returns the original accrued amount; when claim is false, stores the
          accrued value and returns 0.
  pool/src/emissions/manager.rs:
    content_sha256: efde40b6771e6cf284f8e2cc3fbec10086b03fbebd349cda1e02dd58f3f8759c
    functions:
      pool/src/emissions/manager.rs::set_pool_emissions:
        authorization: No explicit authorization check in this function; caller must
          enforce access control externally.
        vector_params: 'Takes `res_emission_metadata: Vec<ReserveEmissionMetadata>`
          containing reserve index, reserve type (0 or 1), and share for each entry.'
        sentinel_values: Panics with `PoolError::BadRequest` if `res_type > 1`, if
          `res_index` is not in the reserve list, or if `share == 0`.
      pool/src/emissions/manager.rs::gulp_emissions:
        authorization: No direct authorization; delegates to backstop client's `gulp_emissions`
          which may enforce that the pool is in the backstop reward zone.
        time_dependent: Indirectly time-dependent via `do_gulp_emissions` and `update_reserve_emission_eps`
          which use `e.ledger().timestamp()` for expiration and EPS calculations.
        sentinel_values: Panics (via `do_gulp_emissions`) with `PoolError::BadRequest`
          if `new_emissions < SCALAR_7`.
      pool/src/emissions/manager.rs::do_gulp_emissions:
        authorization: Private function; no authorization check; relies on caller
          (`gulp_emissions`) for access control.
        time_dependent: Indirectly time-dependent through `update_reserve_emission_eps`
          which reads `e.ledger().timestamp()` to compute expiration and remaining
          emissions.
        sentinel_values: Panics with `PoolError::BadRequest` if `new_emissions < SCALAR_7`
          (10^7) to avoid rounding issues; skips disabled reserves (res_config.enabled
          == false).
      pool/src/emissions/manager.rs::update_reserve_emission_eps:
        authorization: Private function; no authorization check.
        time_dependent: Uses `e.ledger().timestamp()` to set `last_time`, compute
          `expiration` (current timestamp + 7 days in seconds), and calculate remaining
          un-emitted tokens from previous config.
        sentinel_values: Panics with `PoolError::BadRequest` if `res_token_id % 2`
          yields an unexpected value (not 0 or 1); initializes `index` to 0 when no
          prior emission data exists.
