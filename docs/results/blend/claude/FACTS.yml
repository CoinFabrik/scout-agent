      pool/src/contract.rs::PoolContract::set_status:
        authorization: Requires auth from the current admin fetched from storage.
        sentinel_values: 'pool_status uses sentinel values: 0 (admin active), 2 (admin
          on-ice), 4 (admin frozen).'
      pool/src/contract.rs::PoolContract::gulp:
        authorization: No authorization required; callable by anyone.
