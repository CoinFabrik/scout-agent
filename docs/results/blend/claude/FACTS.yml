    content_sha256: dfcd02a86cc57b70f66176e51fa297e9bc8726393f5233cf7c686098f85e2558
    functions:
      pool/src/auctions/auction.rs::AuctionType::from_u32:
        sentinel_values: Panics with PoolError::BadRequest if value is not 0, 1, or
          2.
      pool/src/auctions/auction.rs::create_auction:
        vector_params: bid and lot are Vec<Address> specifying the assets being bid
          on and auctioned off respectively.
        sentinel_values: Panics via AuctionType::from_u32 if auction_type is not 0,
          1, or 2.
      pool/src/auctions/auction.rs::delete_liquidation:
        sentinel_values: Panics with PoolError::BadRequest if no UserLiquidation auction
          exists for the given user.
      pool/src/auctions/auction.rs::fill:
        authorization: Panics with PoolError::InvalidLiquidation if the filler_state.address
          equals the auction user, preventing self-filling.
        time_dependent: Auction scaling in scale_auction depends on the current ledger
          sequence relative to auction_data.block to compute bid and lot modifiers.
        sentinel_values: Remaining auction is set to None (and deleted from storage)
          when both remaining bid and lot maps are empty after scaling.
      pool/src/auctions/auction.rs::scale_auction:
        time_dependent: 'Uses e.ledger().sequence() minus auction_data.block to compute
          per-block bid/lot modifiers: lot scales 0%-100% over blocks 0-200, then
          bid scales 100%-0% over blocks 200-400; bid_modifier is 0 at block_dif >=
          400.'
        sentinel_values: Panics with PoolError::BadRequest if percent_filled > 100
          or == 0; scaled amounts of 0 are excluded from the result maps; returns
          None for remaining auction if both remaining bid and lot maps are empty.
  pool/src/auctions/backstop_interest_auction.rs:
    content_sha256: f250466e9b1f8226b995da6d26f787d68437b16b1834b002a06092af870a0a2a
    functions:
      pool/src/auctions/backstop_interest_auction.rs::create_interest_auction_data:
        authorization: Requires `user` to be the backstop address; panics with BadRequest
          if user != backstop.
        vector_params: '`bid` must contain exactly 1 element equal to the backstop
          token (else InvalidBid); `lot` contains reserve asset addresses whose backstop_credit
          > 0, limited by max_positions.'
        time_dependent: Sets auction block to `e.ledger().sequence() + 1`; panics
          if an InterestAuction is already in progress for the backstop.
        sentinel_values: Interest value must exceed 200 * oracle_scalar (i.e., 200
          USDC equivalent); percent must equal exactly 100; backstop_credit of 0 skips
          the asset; lot must be non-empty (InvalidLot); bid_amount defaults from
          unwrap_or(0) but is always set.
      pool/src/auctions/backstop_interest_auction.rs::fill_interest_auction:
        authorization: Filler must not be the backstop address; panics with BadRequest
          if filler == backstop. Filler donates backstop tokens via backstop_client.donate.
        vector_params: Iterates over auction_data.lot (map of reserve asset addresses
          to lot amounts) and auction_data.bid (map containing backstop token to bid
          amount).
        sentinel_values: backstop_token_bid_amount defaults to 0 via unwrap_or(0);
          donation is skipped if bid amount is 0.
  pool/src/auctions/bad_debt_auction.rs:
    content_sha256: 43f11f438db68ab4f25bc9e17179ddacf2dc679de3bb93f935d0b51c37f445ba
    functions:
      pool/src/auctions/bad_debt_auction.rs::create_bad_debt_auction_data:
        authorization: Requires `user` to be the backstop address; panics with BadRequest
          if user is not the backstop.
        vector_params: '`bid` is a Vec<Address> of reserve assets whose backstop liabilities
          form the auction bid; `lot` must be exactly one element equal to the backstop
          LP token, otherwise panics with InvalidLot.'
        time_dependent: Sets auction block to `e.ledger().sequence() + 1`; panics
          if an active BadDebtAuction already exists for the backstop.
        sentinel_values: Panics with InvalidBid if any bid asset has zero liability
          balance or if total debt_value is 0; `percent` must be exactly 100 or panics
          with BadRequest; `lot_amount` is capped to `pool_backstop_data.tokens` if
          insufficient backstop tokens exist.
      pool/src/auctions/bad_debt_auction.rs::fill_bad_debt_auction:
        authorization: Panics with BadRequest if `filler_state.address` equals the
          backstop address, preventing the backstop from filling its own auction.
        vector_params: Uses `auction_data.bid` (Map of asset to d_token amounts) to
          transfer liability positions from backstop to filler; `auction_data.lot`
          (Map of backstop token to amount) determines backstop tokens drawn to filler.
        time_dependent: After filling, if backstop still has liabilities and `calc_pool_backstop_threshold`
          is below 0_0000003 (~5% of threshold), all remaining backstop liabilities
          are defaulted (burned).
        sentinel_values: '`lot_amount` defaults to 0 via `unwrap_or(0)` if the backstop
          token key is missing; the draw call is skipped when lot_amount is 0; threshold
          sentinel is 0_0000003 for triggering bad debt default.'
