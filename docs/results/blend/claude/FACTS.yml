          swap and deposit logic; min LP tokens out is hardcoded to 0 in dep_tokn_amt_in_get_lp_tokns_out.
  backstop/src/emissions/distributor.rs:
    content_sha256: ac7225d6cc54bab0b39836ccc0d508a048b0af24e0bef098ad3a7a321b3ead9c
    functions:
      backstop/src/emissions/distributor.rs::update_emissions:
        time_dependent: Calls update_rz_emis_data and update_emission_data which use
          e.ledger().timestamp() to advance the emissions index.
      backstop/src/emissions/distributor.rs::claim_emissions:
        time_dependent: Calls update_rz_emis_data and update_emission_data which use
          e.ledger().timestamp() to advance the emissions index.
        sentinel_values: Returns 0 if no emission data exists for the pool (None case)
          or if no accrual occurred.
      backstop/src/emissions/distributor.rs::update_emission_data:
        time_dependent: Uses e.ledger().timestamp() to compute elapsed time for index
          accrual; caps at emis_data.expiration; short-circuits if timestamp equals
          last_time or last_time >= expiration.
        sentinel_values: Returns None if no backstop emission data exists for the
          pool; returns Some(emis_data) unchanged if eps==0, pool_balance.shares==0,
          last_time>=expiration, or timestamp==last_time.
      backstop/src/emissions/distributor.rs::update_user_emissions:
        sentinel_values: Returns 0 when no accrual occurred and no claim was requested,
          or when to_claim is false (via set_user_emissions). When user has no prior
          emission data and zero shares, initializes accrued to 0.
      backstop/src/emissions/distributor.rs::set_user_emissions:
        sentinel_values: When to_claim is true, stores accrued as 0 in ledger and
          returns the original accrued amount; when to_claim is false, stores the
          accrued value and returns 0.
  backstop/src/emissions/manager.rs:
    content_sha256: 8e6d72f6c80b48e78441cc39c36466c9533d821dfaa727262cc83382e84db36d
    functions:
      backstop/src/emissions/manager.rs::add_to_reward_zone:
        authorization: No explicit auth check; panics if pool is already in reward
          zone, below threshold, or zone is full without a valid swap candidate.
        vector_params: Reads and mutates the reward_zone Vec<Address> from storage;
          pushes to_add to front and optionally removes to_remove.
        sentinel_values: Sets removed pool's emission index to i128::MAX to halt further
          emissions; initializes new pool accrued to 0 if no prior emission data exists.
      backstop/src/emissions/manager.rs::remove_from_reward_zone:
        authorization: No explicit auth check; panics with BadRequest if the pool
          is still above the minimum backstop deposit threshold.
        vector_params: Reads and mutates the reward_zone Vec<Address> from storage,
          removing the specified pool.
      backstop/src/emissions/manager.rs::remove_pool:
        vector_params: Mutates the passed reward_zone Vec<Address> by removing to_remove
          at its found index.
        time_dependent: Panics if last_distribution_time is more than 24 hours before
          the current ledger timestamp, ensuring distribute was run recently.
        sentinel_values: Sets the removed pool's emission index to i128::MAX to permanently
          stop further emissions accrual.
      backstop/src/emissions/manager.rs::distribute:
        authorization: No explicit caller auth; panics if reward zone is empty or
          if not enough time (1 hour) has passed since last distribution.
        vector_params: Iterates over the reward_zone Vec<Address> to sum non_queued_tokens
          for all pools.
        time_dependent: Returns 0 and sets last_distribution_time on first call or
          after backstop swap reset; computes new_emissions from elapsed seconds since
          last distribution; enforces a minimum 1-hour gap.
        sentinel_values: Returns 0 when last_distribution is 0 (first call) or when
          needs_reset is true (post-backfill swap); checks MAX_BACKFILLED_EMISSIONS
          cap for backfill mode.
      backstop/src/emissions/manager.rs::gulp_emissions:
        time_dependent: Sets token allowance expiry to current ledger sequence + LEDGER_BUMP_USER
          (~120 days).
        sentinel_values: Returns (0, 0) if no new emissions are available; splits
          new emissions 70%/30% between backstop and pool.
      backstop/src/emissions/manager.rs::update_rz_emis_data:
        sentinel_values: Returns 0 if no emission data exists for the pool or if the
          pool's index is already at or above the global gulp index and to_gulp is
          false.
      backstop/src/emissions/manager.rs::set_rz_emissions:
        sentinel_values: When to_gulp is true, resets accrued to 0 in storage and
          returns the accrued amount; when false, persists accrued and returns 0.
      backstop/src/emissions/manager.rs::set_backstop_emission_eps:
        time_dependent: Computes expiration as current ledger timestamp + 7 days;
          recalculates EPS based on remaining time from prior config; forces last_time
          to current timestamp.
        sentinel_values: Initializes index to 0 and last_time to current timestamp
          when no prior emission data exists for the pool.
