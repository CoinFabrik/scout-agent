        sentinel_values: Accumulates amount into pool_transfer for asset, using unwrap_or(0)
          when no prior entry exists.
      pool/src/pool/actions.rs::Actions::do_check_health:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: Sets check_health flag to true and never resets it here.
      pool/src/pool/actions.rs::build_actions_from_request:
        authorization: Validates each request by requiring nonnegative amount, pool-level
          action allowance, and per-request-type/reserve or auction checks in downstream
          calls; no direct caller auth in this function.
        vector_params: 'Processes requests: Vec<Request> by iterating all entries
          in order.'
        time_dependent: No explicit time/block dependency in this file function.
        sentinel_values: Uses request_type discriminants 0..9 via from_u32; negative
          amounts rejected; DeleteLiquidationAuction ignores request fields except
          type; bad debt and interest auction types expect special address semantics
          per comments.
      pool/src/pool/actions.rs::apply_supply:
        authorization: Requires reserve-level action_allowed for the request type
          after loading the reserve.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: Converts amount to b-tokens with to_b_token_down and records
          spender transfer of full request.amount.
      pool/src/pool/actions.rs::apply_withdraw:
        authorization: No explicit reserve.require_action_allowed call here; relies
          on prior request validation and reserve load.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: If requested burn exceeds current supplied b-tokens, caps
          burn at cur_b_tokens and recomputes tokens_out from all current b-tokens;
          otherwise uses request.amount directly.
      pool/src/pool/actions.rs::apply_supply_collateral:
        authorization: Requires reserve-level action_allowed for the request type
          after loading the reserve.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: Mints b-tokens with to_b_token_down, transfers full request.amount
          from spender, and panics with ExceededCollateralCap if reserve.total_supply(e)
          exceeds reserve.config.collateral_cap.
      pool/src/pool/actions.rs::apply_withdraw_collateral:
        authorization: No explicit reserve.require_action_allowed call here; relies
          on prior request validation and reserve load.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: If requested collateral burn exceeds current collateral b-tokens,
          caps burn at cur_b_tokens and recomputes tokens_out from all current b-tokens;
          always sets check_health true.
      pool/src/pool/actions.rs::apply_borrow:
        authorization: Requires reserve-level action_allowed for the request type
          and reserve utilization below max.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: Converts amount to debt tokens with to_d_token_up, transfers
          full request.amount from pool, and sets check_health true.
      pool/src/pool/actions.rs::apply_repay:
        authorization: No explicit reserve.require_action_allowed call here; relies
          on prior request validation and reserve load.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: If computed d_tokens_burnt exceeds current debt, repays only
          current debt, refunds request.amount minus current underlying borrowed,
          and require_nonnegative checks refund; otherwise burns d_tokens_burnt and
          takes full request.amount.
