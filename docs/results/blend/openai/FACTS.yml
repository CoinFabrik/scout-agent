        authorization: None in this function; no caller/auth checks before creating
          and storing the auction.
        vector_params: bid and lot are Vec<Address> inputs forwarded unchanged to
          the auction-type-specific creation helper.
        time_dependent: No direct time dependence; stores returned AuctionData as-is.
        sentinel_values: auction_type must be 0/1/2 via from_u32 or panic BadRequest;
          percent semantics are delegated to helper validation.
      pool/src/auctions/auction.rs::delete_liquidation:
        authorization: None; deletes only the UserLiquidation auction for the provided
          user without auth or health verification.
        time_dependent: No.
        sentinel_values: Requires an existing auction under AuctionType::UserLiquidation
          (u32 0) or panics with BadRequest.
      pool/src/auctions/auction.rs::fill:
        authorization: Rejects self-fill when user == filler_state.address; otherwise
          no explicit auth check in this function.
        time_dependent: Yes; uses scale_auction, which depends on current ledger sequence
          versus auction start block.
        sentinel_values: auction_type must be valid 0/1/2; storage::get_auction must
          find an auction; percent_filled validation is delegated to scale_auction;
          if no remainder, stored auction is deleted.
      pool/src/auctions/auction.rs::scale_auction:
        authorization: None; internal scaling helper only.
        time_dependent: Yes; scales bid/lot using ledger.sequence() - auction_data.block,
          with 0.5% per-block adjustment, lot ramping to 100% by block 200 and bid
          decaying to 0 by block 400.
        sentinel_values: percent_filled must be 1..=100 or panic BadRequest; bid_modifier
          becomes 0 at block_dif >= 400; returns None for remaining auction when both
          remaining bid and lot maps are empty.
  pool/src/auctions/backstop_interest_auction.rs:
    content_sha256: f250466e9b1f8226b995da6d26f787d68437b16b1834b002a06092af870a0a2a
    functions:
      pool/src/auctions/backstop_interest_auction.rs::create_interest_auction_data:
        authorization: Only callable when user equals stored backstop address; otherwise
          BadRequest.
        vector_params: bid must contain exactly one address equal to backstop token;
          lot length must not exceed pool.config.max_positions and each lot asset
          is included only if its reserve backstop_credit > 0.
        time_dependent: Sets auction_data.block to current ledger sequence + 1.
        sentinel_values: Requires percent == 100; rejects existing interest auction,
          empty resulting lot, interest_value <= 200 * 10^price_decimals, and invalid
          bid; zero/absent backstop_credit assets are skipped.
      pool/src/auctions/backstop_interest_auction.rs::fill_interest_auction:
        authorization: Filler must not be the backstop address; otherwise BadRequest.
        vector_params: No vector parameters; iterates auction_data.lot entries and
          reads the backstop token amount from auction_data.bid.
        time_dependent: No time-dependent logic.
        sentinel_values: Uses auction_data.bid.get(backstop_token).unwrap_or(0); donates
          only if bid amount > 0, then subtracts each lot_amount from reserve backstop_credit
          and transfers tokens.
  pool/src/auctions/bad_debt_auction.rs:
    content_sha256: 43f11f438db68ab4f25bc9e17179ddacf2dc679de3bb93f935d0b51c37f445ba
    functions:
      pool/src/auctions/bad_debt_auction.rs::create_bad_debt_auction_data:
        authorization: Only the configured backstop address may create this auction;
          otherwise BadRequest, and it also rejects if a bad-debt auction already
          exists.
        vector_params: bid must not exceed max_positions and every listed asset must
          correspond to a positive backstop liability; lot must contain exactly one
          address equal to the backstop token.
        time_dependent: Sets auction_data.block to current ledger sequence + 1; otherwise
          no time-based branching.
        sentinel_values: Requires percent == 100; rejects empty/zero-value bid, missing
          liability entries via unwrap_or(0), invalid lot length/token, and caps lot_amount
          at available backstop tokens with min(...).
      pool/src/auctions/bad_debt_auction.rs::fill_bad_debt_auction:
        authorization: Any filler except the backstop address may fill; if filler_state.address
          equals backstop address it errors with BadRequest.
        vector_params: No vector parameters; consumes auction_data maps, transferring
          bid liabilities from backstop to filler and reading the lot amount for the
          backstop token.
        time_dependent: No direct ledger-time dependence; only conditionally defaults
          remaining liabilities when computed backstop threshold is below a fixed
          cutoff.
        sentinel_values: Uses lot.get(...).unwrap_or(0) so zero means no token draw;
          defaults debt only if threshold < 0_0000003 and remaining liabilities are
          non-empty.
