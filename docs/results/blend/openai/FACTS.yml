  backstop/src/emissions/claim.rs:
    content_sha256: 7dcb194a89abdd3c7b4545ce0a098d8de6f12ab4503e337315cc67cc48de7e5a
    functions:
      backstop/src/emissions/claim.rs::execute_claim:
        authorization: No caller auth check on from/to; if total claimed > 0 the contract
          authorizes itself to invoke BLND token approve for the current contract,
          backstop token, claimed amount, and computed approval ledger.
        vector_params: 'pool_addresses: &Vec<Address>; must be non-empty, iterated
          twice to compute per-pool claims and then distribute LP deposits proportionally
          by pool.'
        time_dependent: Yes; approval_ledger is derived from the current ledger sequence
          as ((sequence / 100000) + 1) * 100000.
        sentinel_values: Empty pool_addresses panics with BackstopError::BadRequest;
          claim/deposit path only runs when claimed > 0; passes &0 as a minimum-output/slippage-style
          argument to dep_tokn_amt_in_get_lp_tokns_out.
  backstop/src/emissions/distributor.rs:
    content_sha256: ac7225d6cc54bab0b39836ccc0d508a048b0af24e0bef098ad3a7a321b3ead9c
    functions:
      backstop/src/emissions/distributor.rs::update_emissions:
        authorization: No explicit authorization; updates emission state for the provided
          pool and user.
        time_dependent: Yes; indirectly depends on ledger timestamp through update_rz_emis_data
          and update_emission_data.
        sentinel_values: Skips user update if update_emission_data returns None.
      backstop/src/emissions/distributor.rs::claim_emissions:
        authorization: No explicit authorization; computes and records claimable emissions
          for the provided pool and user.
        time_dependent: Yes; indirectly depends on ledger timestamp through update_rz_emis_data
          and update_emission_data.
        sentinel_values: Returns 0 if update_emission_data returns None; passes to_claim=true
          to zero stored accrued after claim.
      backstop/src/emissions/distributor.rs::update_emission_data:
        authorization: No explicit authorization; updates stored backstop emission
          data for the given pool if present.
        time_dependent: Yes; uses e.ledger().timestamp(), caps accrual at expiration,
          and updates last_time.
        sentinel_values: Returns None if no emission data exists; returns existing
          data unchanged when last_time>=expiration, timestamp==last_time, eps==0,
          or pool shares==0; requires nonnegative unqueued_shares.
      backstop/src/emissions/distributor.rs::update_user_emissions:
        authorization: No explicit authorization; updates stored user emission index/accrual
          for the given pool and user.
        time_dependent: No direct timestamp read; depends on supplied emission index
          data.
        sentinel_values: Returns 0 when user index is unchanged and no claim requested;
          if no prior user data and shares==0 stores zero accrual; to_claim triggers
          payout amount and reset via set_user_emissions; requires nonnegative delta_index.
      backstop/src/emissions/distributor.rs::set_user_emissions:
        authorization: No explicit authorization; writes user emission data for the
          given pool and user.
        time_dependent: No.
        sentinel_values: If to_claim is true, stores accrued=0 and returns prior accrued;
          otherwise stores accrued and returns 0.
  backstop/src/emissions/manager.rs:
    content_sha256: 8e6d72f6c80b48e78441cc39c36466c9533d821dfaa727262cc83382e84db36d
    functions:
      backstop/src/emissions/manager.rs::add_to_reward_zone:
        authorization: No caller auth check; enforces pool not already in reward zone
          and to_add must satisfy minimum backstop threshold, and if full requires
          to_remove plus higher token balance than removed pool.
        vector_params: Uses stored Vec<Address> reward_zone; pushes to_add to front
          and may remove one address via helper, but takes no vector parameter.
        time_dependent: No direct time logic, but removal path delegates to remove_pool
          which requires a distribution within the last 24 hours.
        sentinel_values: Option<Address> to_remove uses None to signal no swap candidate;
          initializes new pool emission state with accrued 0 when absent.
      backstop/src/emissions/manager.rs::remove_from_reward_zone:
        authorization: No caller auth check; only allows removal when target pool
          is below minimum backstop threshold, otherwise errors.
        vector_params: Uses stored Vec<Address> reward_zone and removes the target
          via helper; no vector argument in signature.
        time_dependent: Indirectly time-dependent through remove_pool, which rejects
          removal if last distribution is older than 24 hours.
        sentinel_values: No explicit sentinel input; helper sets removed pool emission
          index to i128::MAX as a stop-emissions sentinel.
      backstop/src/emissions/manager.rs::remove_pool:
        authorization: No caller auth check; requires target address to exist in reward_zone
          or errors.
        vector_params: Mutates &mut Vec<Address> reward_zone by locating first_index_of
          target and removing that entry.
        time_dependent: Requires last_distribution_time to be within 24*60*60 seconds
          of current ledger timestamp before removal.
        sentinel_values: Sets removed pool emission index to i128::MAX to disable
          future emissions; None from first_index_of means missing entry and triggers
          error.
      backstop/src/emissions/manager.rs::distribute:
        authorization: No caller auth check; requires non-empty reward zone, sufficient
          elapsed time since last distribution, and enforces max backfill cap when
          emitter lookup fails.
        vector_params: Iterates over stored reward_zone Vec<Address> to sum non_queued_tokens
          across pools; no vector parameter.
        time_dependent: Driven by emitter last distribution, stored last_distribution_time,
          current ledger timestamp for backfill fallback, and requires emitter_last_distribution
          > last_distribution + 1 hour.
        sentinel_values: Treats last_distribution == 0 as uninitialized first run;
          emitter client error acts as backfill mode sentinel; backfill_status Some(true)/None
          controls reset behavior.
      backstop/src/emissions/manager.rs::gulp_emissions:
        authorization: No caller auth check; processes any provided pool address and
          only acts when accrued emissions are positive.
        vector_params: No vector parameters or vector iteration.
        time_dependent: Uses current ledger sequence to set token allowance expiration
          ~120 days ahead; otherwise depends on update routines rather than direct
          timestamp gating.
        sentinel_values: Returns (0, 0) when no new emissions; splits positive emissions
          by fixed 70% backstop and 30% pool proportions.
      backstop/src/emissions/manager.rs::update_rz_emis_data:
        authorization: No caller auth check; only updates if reward-zone emission
          data exists for the pool.
        vector_params: No vector parameters.
        time_dependent: Uses current global reward-zone emission index rather than
          wall-clock time; updates when stored index is behind gulp index or when
          forced by to_gulp.
        sentinel_values: Missing emission data returns 0; boolean to_gulp forces state
          flush even if index unchanged, and zero non_queued_tokens still updates
          index with no added accrual.
      backstop/src/emissions/manager.rs::set_rz_emissions:
        authorization: No caller auth check; internal storage setter only.
        vector_params: No vector parameters.
        time_dependent: No direct time dependence.
        sentinel_values: to_gulp=true stores accrued as 0 and returns prior accrued
          amount; to_gulp=false stores accrued and returns 0.
      backstop/src/emissions/manager.rs::set_backstop_emission_eps:
        authorization: No caller auth check; updates or initializes backstop emission
          schedule for the pool.
        vector_params: No vector parameters.
        time_dependent: Sets expiration to current ledger timestamp + 7 days, normalizes
          last_time to current timestamp, and rolls forward un-emitted tokens if prior
          expiration is still in the future.
        sentinel_values: Absence of prior emission data initializes index 0 and last_time
          now; no special numeric sentinel beyond first-time None branch.
