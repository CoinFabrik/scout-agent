      backstop/src/backstop/user.rs::UserBalance::dequeue_shares:
        authorization: None; no caller/auth checks, only queued-balance validation.
        vector_params: No vector parameters; consumes and possibly rewrites entries
          from self.q4w back.
        time_dependent: No; ignores Q4W expiration timestamps.
        sentinel_values: Uses left_to_dequeue reaching 0 as completion; panics with
          BalanceError if remaining amount > 0.
