        sentinel_values: Uses MAX_Q4W_SIZE as queue cap; panics on insufficient shares
          or excessive q4w entries.
      backstop/src/backstop/user.rs::UserBalance::withdraw_shares:
        authorization: None; no caller/auth checks, only queued-balance/expiry validation.
        vector_params: No vector parameters; consumes and possibly rewrites entries
          from self.q4w front.
        time_dependent: Yes; each queued entry must have exp <= current ledger timestamp
          or it panics NotExpired.
        sentinel_values: Uses left_to_withdraw reaching 0 as completion; panics with
