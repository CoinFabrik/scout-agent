  pool/src/pool/health_factor.rs:
    content_sha256: 2ab0db16448b282b8253ba973c135c1bba64bd899a2fc80401cc407375a82cc7
    functions:
      pool/src/pool/health_factor.rs::PositionData::calculate_from_positions:
        authorization: None; computes position aggregates from provided pool and positions
          without caller/auth checks.
        vector_params: Iterates reserve list and indexed collateral/liabilities vectors
          in Positions; missing entries default to 0 via unwrap_or(0).
        time_dependent: Uses current pool price decimals, reserve data, and oracle
          prices loaded from storage/pool at call time.
        sentinel_values: Skips reserves when both balances are 0; initializes aggregate
          totals to 0 and returns them if no nonzero positions.
      pool/src/pool/health_factor.rs::PositionData::as_health_factor:
        authorization: None; pure ratio calculation on PositionData fields.
        time_dependent: Not directly time-based; result depends only on current struct
          fields provided to the method.
        sentinel_values: No explicit sentinel handling; divides collateral_base by
          liability_base using fixed_div_floor with scalar.
      pool/src/pool/health_factor.rs::PositionData::is_hf_over:
        authorization: None; compares computed health factor against supplied max
          threshold without auth checks.
        time_dependent: Not directly time-based; depends on current PositionData fields
          and input max.
        sentinel_values: If liability_base == 0 returns true immediately; max is expected
          in 7-decimal precision and scaled with SCALAR_7.
      pool/src/pool/health_factor.rs::PositionData::is_hf_under:
        authorization: None; compares computed health factor against supplied min
          threshold without auth checks.
        time_dependent: Not directly time-based; depends on current PositionData fields
          and input min.
        sentinel_values: If liability_base == 0 returns false immediately; min is
          expected in 7-decimal precision and scaled with SCALAR_7.
  pool/src/pool/interest.rs:
    content_sha256: 194c6e1f0a825c86882e658312dea44d82b6434c3e85eed6d16192505b2d5b54
    functions:
      pool/src/pool/interest.rs::calc_accrual:
        authorization: No authorization checks; pure public calculation using Env
          timestamp, ReserveConfig, cur_util, ir_mod, and last_time.
        time_dependent: Yes; depends on e.ledger().timestamp() and last_time, panicking
          if elapsed time is less than 1 second, and scales accrual by elapsed time
          over SECONDS_PER_YEAR.
        sentinel_values: Uses utilization breakpoints target_util and 0_9500000 with
          final 0_0500000 span; requires delta_time >= 1 or panics with InternalError;
          clamps new_ir_mod to [SCALAR_7 / 10, 10 * SCALAR_7].
  pool/src/pool/mod.rs:
    content_sha256: 71954ddb5f0704e1c8f62784d72bb1280c887f9731b198c326b43f48d7a77309
    functions: {}
  pool/src/pool/pool.rs:
    content_sha256: 54f68cd45b06b6a1bfd27c3f85d90c2f8e937fe15159531ec4a3170358a9619b
    functions:
      pool/src/pool/pool.rs::Pool::load:
        time_dependent: 'no'
        sentinel_values: price_decimals initialized to None; empty reserve/reserve_to_store/prices
          collections as cache sentinels
      pool/src/pool/pool.rs::Pool::load_reserve:
        vector_params: uses internal Vec<Address> reserves_to_store; params are asset:&Address
          and store:bool
        time_dependent: indirectly yes via Reserve::load comment says updated to current
          ledger timestamp when not cached
        sentinel_values: store=false skips write-tracking; cached reserve in self.reserves
          short-circuits ledger load
      pool/src/pool/pool.rs::Pool::cache_reserve:
        time_dependent: 'no'
        sentinel_values: keys cache by reserve.asset; overwrites any existing cached
          reserve for that asset
      pool/src/pool/pool.rs::Pool::store_cached_reserves:
        vector_params: iterates internal Vec<Address> reserves_to_store
        time_dependent: 'no'
        sentinel_values: panics with InternalReserveNotFound if a tracked address
          has no cached reserve
      pool/src/pool/pool.rs::Pool::require_action_allowed:
        authorization: pool-status gate only; no caller auth
        time_dependent: 'no'
        sentinel_values: action_type sentinels 4 or 9 blocked when status>1, 2 or
          0 blocked when status>3; otherwise panics InvalidPoolStatus
      pool/src/pool/pool.rs::Pool::require_under_max:
        time_dependent: 'no'
        sentinel_values: only panics MaxPositionsExceeded when effective_count exceeds
          max_positions and is greater than previous_num
      pool/src/pool/pool.rs::Pool::load_price_decimals:
        time_dependent: 'no'
        sentinel_values: cached Option<u32> price_decimals uses Some(decimals) vs
          None to avoid repeated oracle calls
      pool/src/pool/pool.rs::Pool::load_price:
        time_dependent: yes; rejects oracle prices older than 24*60*60 seconds relative
          to ledger timestamp
        sentinel_values: returns cached price if present; panics InvalidPrice if price<=0
          or stale; unwrap_optimized requires oracle lastprice to be present
  pool/src/pool/reserve.rs:
    content_sha256: f438c740d7942bb58f155f9dc425437e135b2c6ca0149e726f520a6c7ea10105
    functions:
      pool/src/pool/reserve.rs::Reserve::load:
        authorization: None; reads reserve config/data from storage for the provided
          asset and updates reserve state without caller auth checks.
        time_dependent: Yes; branches on e.ledger().timestamp(), skips if already
          updated this ledger, passes last_time into calc_accrual, and sets data.last_time
          to current ledger timestamp.
        sentinel_values: Short-circuits when current timestamp == data.last_time,
          when data.b_supply == 0, and when utilization == 0.
      pool/src/pool/reserve.rs::Reserve::store:
        authorization: None; writes this reserve's data back to storage with no caller
          auth checks.
        time_dependent: No direct time logic.
      pool/src/pool/reserve.rs::Reserve::accrue:
        authorization: None; internal state update only, no auth checks.
        time_dependent: No direct time logic.
        sentinel_values: Only acts when accrued > 0; initializes new_backstop_credit
          to 0 and only computes/adds it when bstop_rate > 0.
      pool/src/pool/reserve.rs::Reserve::utilization:
        time_dependent: No direct time logic.
        sentinel_values: None; computes liabilities/supply ratio directly.
      pool/src/pool/reserve.rs::Reserve::require_utilization_below_max:
        authorization: None; enforces reserve config by panicking if utilization exceeds
          max_util.
        time_dependent: No direct time logic.
        sentinel_values: Panics when utilization() > config.max_util.
      pool/src/pool/reserve.rs::Reserve::require_action_allowed:
        authorization: None; checks reserve enabled flag against requested action
          type rather than caller identity.
        time_dependent: No direct time logic.
        sentinel_values: If config.enabled is false, panics for action_type equal
          to Supply, SupplyCollateral, or Borrow request discriminants.
      pool/src/pool/reserve.rs::Reserve::total_liabilities:
        time_dependent: No direct time logic.
        sentinel_values: Uses data.d_supply as the debt-token amount to convert; no
          special-case branching.
      pool/src/pool/reserve.rs::Reserve::total_supply:
        time_dependent: No direct time logic.
        sentinel_values: Uses data.b_supply as the b-token amount to convert; no special-case
          branching.
      pool/src/pool/reserve.rs::Reserve::to_asset_from_d_token:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; converts using data.d_rate with ceiling
          rounding.
      pool/src/pool/reserve.rs::Reserve::to_asset_from_b_token:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; converts using data.b_rate with floor
          rounding.
      pool/src/pool/reserve.rs::Reserve::to_effective_asset_from_d_token:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; divides converted asset amount by
          config.l_factor with ceiling rounding.
      pool/src/pool/reserve.rs::Reserve::to_effective_asset_from_b_token:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; multiplies converted asset amount
          by config.c_factor with floor rounding.
      pool/src/pool/reserve.rs::Reserve::to_d_token_up:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; converts amount by dividing by data.d_rate
          with ceiling rounding.
      pool/src/pool/reserve.rs::Reserve::to_d_token_down:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; converts amount by dividing by data.d_rate
          with floor rounding.
      pool/src/pool/reserve.rs::Reserve::to_b_token_up:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; converts amount by dividing by data.b_rate
          with ceiling rounding.
      pool/src/pool/reserve.rs::Reserve::to_b_token_down:
        time_dependent: No direct time logic.
        sentinel_values: No explicit sentinels; converts amount by dividing by data.b_rate
          with floor rounding.
  pool/src/pool/status.rs:
    content_sha256: 733e7276fa4fdc1fc6520d2a859824aab826605f5e5c209adea7f613a1d53826
    functions:
      pool/src/pool/status.rs::execute_update_pool_status:
        authorization: No caller auth check; callable with only contract env and reads/stores
          pool config based on backstop data.
        time_dependent: Uses current contract address to query backstop pool_data;
          no timestamp/ledger-time logic.
        sentinel_values: Status sentinels 6 and 4 always reject; admin 2 may become
          5 if q4w_pct >= 0_7500000; admin 0 may become 3 if threshold < SCALAR_7
          or q4w_pct >= 0_5000000; unset/other becomes 5 at q4w_pct >= 0_6000000,
          3 at q4w_pct >= 0_3000000 or under-threshold, else 1.
      pool/src/pool/status.rs::execute_set_pool_status:
        authorization: No explicit auth enforced in this function despite admin-oriented
          behavior; directly sets stored pool status if input/status constraints pass.
        vector_params: None; single scalar pool_status input.
        time_dependent: No timestamp/ledger-time logic; uses current contract address
          only to fetch backstop pool_data.
        sentinel_values: Accepted input statuses are 0,2,3,4; 0 requires threshold
          >= SCALAR_7 and q4w_pct < 0_5000000, 2 and 3 require q4w_pct < 0_7500000,
          4 always allowed, all other inputs panic with BadRequest.
      pool/src/pool/status.rs::calc_pool_backstop_threshold:
        authorization: Pure calculation helper with no auth.
        vector_params: None; takes one PoolBackstopData reference, no vectors.
        time_dependent: Not time-dependent.
        sentinel_values: Uses SCALAR_7 to floor blnd/usdc balances and scale output,
          divides by fixed threshold_pc = 10_000_000_000_000_000_000_000_000i128 (1e25),
          and relies on saturating_mul to cap overflow rather than distinct overflow
          sentinels.
  pool/src/pool/submit.rs:
    content_sha256: 094869f0c461728e2cf10e59a5c63e56ebf9466a9e7a1eba9578ee6dc355bd49
    functions:
      pool/src/pool/submit.rs::execute_submit:
        authorization: No explicit auth check; rejects from/spender/to equal to current
          contract address before loading pool/user state and executing transfers.
        vector_params: 'Takes requests: Vec<Request>; passed to build_actions_from_request
          for batched action construction.'
        time_dependent: No direct time/ledger dependency; validation may consult auction
          state and health calculations but no timestamp/deadline input.
        sentinel_values: BadRequest if from/spender/to is current contract address;
          use_allowance boolean switches allowance vs direct transfer path.
      pool/src/pool/submit.rs::execute_submit_with_flash_loan:
        authorization: No explicit auth check; rejects from equal to current contract
          address, then performs flash-loan transfer and callback using from as caller.
        vector_params: 'Takes requests: Vec<Request>; processed after pre-adding flash-loan
          liabilities via build_actions_from_request.'
        time_dependent: No direct time parameter; always enforces post-submit health
          check and may be affected by auction-state validation inside validate_submit.
        sentinel_values: BadRequest if from is current contract address; flash loan
          callback passes fee sentinel 0; validate_submit is called with check_health
          fixed to true.
      pool/src/pool/submit.rs::validate_submit:
        authorization: No caller authorization; validates pool/user state constraints,
          including blocking users with an active liquidation auction.
        vector_params: No vector parameters; inspects from_state.positions and previous
          position count.
        time_dependent: Indirectly state-dependent through storage::has_auction and
          current oracle/position health calculation, but no explicit timestamp input.
        sentinel_values: Health-factor floor sentinel 1_0000100 triggers InvalidHf
          if under; also errors on AuctionInProgress and MinCollateralNotMet when
          collateral_base is below pool.config.min_collateral.
      pool/src/pool/submit.rs::handle_transfer_with_allowance:
        authorization: Uses spender allowance by calling token.transfer_from with
          the contract as spender authority; no separate auth check in this function.
        vector_params: No vector parameters; iterates action transfer maps and aggregates
          per-token net balances in a Map<Address,i128>.
        time_dependent: Not time-dependent; purely computes and executes net token
          transfers.
        sentinel_values: 'Net balance sign is sentinel logic: amount < 0 pulls from
          spender, amount > 0 sends from pool to to, amount == 0 does nothing.'
      pool/src/pool/submit.rs::handle_transfers:
        authorization: No explicit auth check; directly transfers tokens from spender
          to pool and from pool to to without allowance path.
        vector_params: No vector parameters; iterates action spender_transfer and
          pool_transfer collections.
        time_dependent: Not time-dependent; performs immediate token transfers only.
        sentinel_values: No special sentinel constants; behavior is determined by
          presence of transfer entries in the action maps.
