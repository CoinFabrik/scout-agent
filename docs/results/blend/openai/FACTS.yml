          < SCALAR_7, max_positions in [2, 2*MAX_RESERVES], and min_collateral >=
          0.
      pool/src/pool/config.rs::execute_update_pool:
        authorization: No caller authorization check in this function; updates existing
          pool config fields then validates and stores.
        vector_params: No vector/list parameters.
        time_dependent: No time or ledger timestamp dependency.
        sentinel_values: Validation enforces bstop_rate < SCALAR_7, max_positions
          in [2, 2*MAX_RESERVES], and min_collateral >= 0.
      pool/src/pool/config.rs::execute_queue_set_reserve:
        authorization: No caller authorization check in this function; queues reserve
          initialization only if no existing queued reserve for the asset.
        vector_params: No vector/list parameters.
        time_dependent: Uses current ledger timestamp; if pool status != 6, unlock_time
          is delayed by SECONDS_PER_WEEK, otherwise unlocks immediately.
        sentinel_values: Rejects if a queued reserve already exists; status 6 is treated
          as setup/no-timelock mode.
      pool/src/pool/config.rs::execute_cancel_queued_set_reserve:
        authorization: No caller authorization check in this function; simply deletes
          queued reserve setup for the asset.
        vector_params: No vector/list parameters.
        time_dependent: No time or ledger timestamp dependency.
        sentinel_values: No special sentinel constants beyond deleting any queued
          entry for the asset.
      pool/src/pool/config.rs::execute_set_reserve:
        authorization: No caller authorization check in this function; executes queued
          reserve init for the asset after timelock passes.
        vector_params: No vector/list parameters.
        time_dependent: Requires queued_init.unlock_time <= current ledger timestamp
          or panics InitNotUnlocked.
        sentinel_values: Deletes queued reserve entry before initialization; unlock_time
          acts as the gating sentinel.
      pool/src/pool/config.rs::initialize_reserve:
        authorization: No caller authorization check in this private helper; initializes
          a new reserve or updates an existing one.
        vector_params: No vector/list parameters.
        time_dependent: For new reserves sets last_time to current ledger timestamp.
        sentinel_values: Existing reserve keeps prior index and requires unchanged
          decimals; IR parameter changes reset ir_mod to SCALAR_7; new reserves initialize
          b_rate and d_rate to SCALAR_12, ir_mod to SCALAR_7, supplies/credits to
          0.
      pool/src/pool/config.rs::require_valid_reserve_metadata:
        authorization: No caller authorization check; pure validation helper for reserve
          metadata.
        vector_params: No vector/list parameters.
        time_dependent: No time or ledger timestamp dependency.
        sentinel_values: Requires decimals <= 18, c_factor and l_factor <= SCALAR_7,
          util <= 0_9000000, max_util > util and <= SCALAR_7, r_base in [0_0001000,
          1_0000000), ordered rates r_one <= r_two <= r_three, and reactivity <= 0_0001000.
      pool/src/pool/config.rs::require_valid_pool_config:
        authorization: No caller authorization check; pure validation helper for pool
          config.
        vector_params: No vector/list parameters.
        time_dependent: No time or ledger timestamp dependency.
        sentinel_values: Requires bstop_rate < SCALAR_7, max_positions between 2 and
          2*MAX_RESERVES inclusive, and min_collateral >= 0.
  pool/src/pool/gulp.rs:
