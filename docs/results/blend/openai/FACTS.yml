        time_dependent: Uses current ledger sequence to set AuctionData.block to e.ledger().sequence()
          + 1.
        sentinel_values: percent must be 1..=100; full liquidation is all positions
          with percent >95 but validated at 95; post-liquidation HF must be <=1.15
          and >=1.03, with full-liquidation check using 1.15; caps estimated withdrawn
          collateral pct at scalar and errors if capped without all collateral included.
      pool/src/auctions/user_liquidation_auction.rs::fill_user_liq_auction:
        authorization: No explicit authorization check; loads the specified user and
          transfers positions per auction_data between user_state and filler_state.
        vector_params: No vector parameters directly; consumes auction_data.lot and
          auction_data.bid maps by cloning them for rm_positions and add_positions.
        time_dependent: Not time-dependent.
        sentinel_values: No explicit sentinel constants or threshold checks.
