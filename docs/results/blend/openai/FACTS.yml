    functions:
      pool/src/pool/gulp.rs::execute_gulp:
        authorization: No caller authorization check; uses current contract address
          only to read this contract's token balance.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent; no ledger timestamp/sequence checks.
        sentinel_values: Returns 0 when computed token_balance_delta <= 0; otherwise
