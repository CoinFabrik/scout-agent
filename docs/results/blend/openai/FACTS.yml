  pool/src/emissions/distributor.rs:
    content_sha256: e80752b64a9e2cf062d7742b834c0a6ca7740707bd16e77b00814a35bf563c07
    functions:
      pool/src/emissions/distributor.rs::execute_claim:
        authorization: No explicit auth check; claims emissions for any provided from
          address and transfers accrued BLND from backstop to the specified to address
          via contract-controlled transfer_from.
        vector_params: 'reserve_token_ids: &Vec<u32>; iterates each reserve token
          id to accumulate claimable emissions.'
        time_dependent: Indirectly time-dependent through claim_emissions -> update_emission_data,
          which uses current ledger timestamp and emission expiration to update indices
          before claiming.
        sentinel_values: Returns 0 if nothing claimable; reserve_token_id parity 0/1
          selects liabilities/supply and invalid/missing reserve causes BadRequest
          panic; only transfers if to_claim > 0.
      pool/src/emissions/distributor.rs::update_emissions:
        authorization: No explicit auth check; updates reserve and user emission accounting
          for the supplied user address.
        time_dependent: Yes; calls update_emission_data, which advances emission state
          using ledger timestamp and expiration.
        sentinel_values: No-op if update_emission_data returns None; passes claim=false
          so no tokens are returned/transferred and function returns unit.
      pool/src/emissions/distributor.rs::claim_emissions:
        authorization: No explicit auth check; computes and marks claimed emissions
          for the supplied user address.
        time_dependent: Yes; calls update_emission_data, which depends on current
          ledger timestamp and expiration.
        sentinel_values: Returns 0 when no reserve emission data exists; otherwise
          delegates with claim=true to return accrued amount.
      pool/src/emissions/distributor.rs::update_emission_data:
        authorization: No explicit auth check; updates stored reserve emission data
          for the given reserve token id if present.
        time_dependent: Directly time-dependent on e.ledger().timestamp(); caps updates
          at expiration and skips when timestamp equals last_time or emissions are
          expired.
        sentinel_values: Returns None if no emission data exists; early-returns unchanged
          data when last_time >= expiration, current timestamp == last_time, eps ==
          0, or supply == 0.
      pool/src/emissions/distributor.rs::update_user_emissions:
        authorization: No explicit auth check; updates emission accrual state for
          the specified user address.
        time_dependent: Indirectly time-dependent because it consumes reserve emission
          index produced from time-based reserve updates, but uses no timestamp itself.
        sentinel_values: Returns 0 if existing user index matches reserve index and
          claim is false; if no user data and balance == 0 initializes with accrued
          0; if balance == 0 no new accrual is added; require_nonnegative enforces
          nonnegative index delta.
      pool/src/emissions/distributor.rs::set_user_emissions:
        authorization: No explicit auth check; writes user emission data for the specified
          user address.
        time_dependent: Not directly time-dependent.
        sentinel_values: If claim is true, stores accrued as 0 and returns prior accrued
          amount; otherwise stores accrued value and returns 0.
  pool/src/emissions/manager.rs:
    content_sha256: efde40b6771e6cf284f8e2cc3fbec10086b03fbebd349cda1e02dd58f3f8759c
    functions:
      pool/src/emissions/manager.rs::set_pool_emissions:
        authorization: No caller authorization check in this function.
        vector_params: Takes Vec<ReserveEmissionMetadata>; iterates all entries and
          validates each before storing shares in a map keyed by res_index*2+res_type.
        time_dependent: Not time-dependent.
        sentinel_values: Rejects res_type > 1, missing reserve index, or share ==
          0 with PoolError::BadRequest.
      pool/src/emissions/manager.rs::gulp_emissions:
        authorization: No caller authorization check in this function.
        vector_params: No vector parameters.
        time_dependent: Not directly time-dependent; delegates to backstop gulp and
          downstream emission update logic.
        sentinel_values: No local sentinel checks; may panic if backstop reward-zone
          precondition fails or delegated gulp processing rejects emissions.
      pool/src/emissions/manager.rs::do_gulp_emissions:
        authorization: Private helper with no caller authorization check.
        vector_params: Builds an internal Vec<(ReserveConfig, Address, u32, u64)>
          of enabled reserve emissions before distributing.
        time_dependent: Not directly using ledger time; splits new_emissions across
          enabled reserves and delegates per-reserve timed updates.
        sentinel_values: Panics with PoolError::BadRequest if new_emissions < SCALAR_7;
          ignores disabled reserves when computing total_share/distribution.
      pool/src/emissions/manager.rs::update_reserve_emission_eps:
        authorization: Private helper with no caller authorization check.
        vector_params: No vector parameters.
        time_dependent: Uses current ledger timestamp to set 7-day expiration, refresh
          last_time, and roll un-emitted tokens from an unexpired prior schedule into
          the new eps.
        sentinel_values: res_token_id%2 selects d_supply for 0 or b_supply for 1,
          otherwise panics with PoolError::BadRequest; absence of prior emission data
          is treated as first-time initialization.
