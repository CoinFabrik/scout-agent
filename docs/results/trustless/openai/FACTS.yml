      contracts/escrow/src/core/escrow.rs::EscrowManager::fund_escrow:
        authorization: signer.require_auth() after validating amount and expected
          escrow against stored escrow
        time_dependent: no time-based logic
        sentinel_values: loads stored escrow via get_escrow; transfers amount from
          signer to current contract; validator may reject mismatched expected_escrow
          or invalid amount
      contracts/escrow/src/core/escrow.rs::EscrowManager::release_funds:
        authorization: release_signer.require_auth() and validate_release_conditions
          on stored escrow and signer
        time_dependent: no time-based logic
        sentinel_values: sets escrow.flags.released = true; errors if contract token
          balance < escrow.amount with EscrowBalanceNotEnoughToSendEarnings; splits
          payout into trustless_work_fee, platform_fee, and receiver_amount
      contracts/escrow/src/core/escrow.rs::EscrowManager::change_escrow_properties:
