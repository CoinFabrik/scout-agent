    functions:
      contracts/escrow/src/core/dispute.rs::DisputeManager::resolve_dispute:
        authorization: Requires dispute_resolver auth via require_auth; further resolver/escrow
          state checks are enforced by validate_dispute_resolution_conditions.
        vector_params: No vector parameters.
        time_dependent: No explicit time/block/timestamp dependence in this function.
        sentinel_values: Transfers to approver/receiver only when net amounts > 0;
          errors if contract token balance is less than approver_funds + receiver_funds.
      contracts/escrow/src/core/dispute.rs::DisputeManager::dispute_escrow:
        authorization: Requires signer auth via require_auth; signer eligibility and
          escrow state are checked by validate_dispute_flag_change_conditions.
        vector_params: No vector parameters.
        time_dependent: No explicit time/block/timestamp dependence in this function.
        sentinel_values: Sets disputed flag true after validation; no special sentinel
          constants beyond boolean flag transition.
