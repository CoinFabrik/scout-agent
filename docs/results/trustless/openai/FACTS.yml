    content_sha256: 8e15773724c2a7b269e96c97341449f75affbc9189cf3ea6895edc3c13f425c1
    functions:
      contracts/escrow/src/modules/fee/calculator.rs::FeeCalculator::calculate_standard_fees:
        authorization: No authorization checks; pure private fee calculation from
          numeric inputs only.
        vector_params: No vector/list parameters; inputs are scalar i128 values total_amount
          and platform_fee_bps.
        time_dependent: Not time-dependent; no block time, timestamp, or temporal
          state used.
        sentinel_values: Uses constant fee basis points TRUSTLESS_WORK_FEE_BPS=30
          and BASIS_POINTS_DENOMINATOR=10000; no special-case sentinel branch values.
      contracts/escrow/src/modules/fee/calculator.rs::FeeCalculator::calculate_dispute_fees:
        authorization: No authorization checks; pure private fee calculation from
          numeric inputs only.
        vector_params: No vector/list parameters; inputs are scalar i128 values approver_funds,
          receiver_funds, platform_fee_bps, and total_resolved_funds.
        time_dependent: Not time-dependent; no block time, timestamp, or temporal
          state used.
        sentinel_values: Uses constants TRUSTLESS_WORK_FEE_BPS=30 and BASIS_POINTS_DENOMINATOR=10000;
          treats total_resolved_funds <= 0 via else branches that set net_approver_funds
          and net_receiver_funds to 0, avoiding proportional fee-share division.
