  contracts/escrow/src/core/milestone.rs:
    content_sha256: a9c679a47e01b4bd6a9a6ee628fe73b2633c8490c6ed2f9d714ee6a0344fb0d6
    functions:
      contracts/escrow/src/core/milestone.rs::MilestoneManager::change_milestone_status:
        authorization: Requires service_provider.require_auth() and validator checks
          via validate_milestone_status_change_conditions against the escrow, milestone
          index, and service_provider.
        vector_params: No vector parameters; updates a milestone selected from existing_escrow.milestones
          by milestone_index.
        time_dependent: No explicit time-dependent logic in this function.
        sentinel_values: Uses Option<String> for new_evidence where None leaves evidence
          unchanged; missing milestone at index returns ContractError::InvalidMileStoneIndex.
      contracts/escrow/src/core/milestone.rs::MilestoneManager::change_milestone_approved_flag:
        authorization: Requires approver.require_auth() and validator checks via validate_milestone_flag_change_conditions
          against the escrow, target milestone, index, and approver.
        vector_params: No vector parameters; updates a milestone selected from existing_escrow.milestones
          by milestone_index.
        time_dependent: No explicit time-dependent logic in this function.
        sentinel_values: Missing milestone at index returns ContractError::InvalidMileStoneIndex;
          new_flag is a plain bool with no sentinel handling.
  contracts/escrow/src/core/validators/dispute.rs:
    content_sha256: 70209a8062d43faa74e0220fc109d5f952d32942726efa5c6037b63c8372d468
    functions:
      contracts/escrow/src/core/validators/dispute.rs::validate_dispute_resolution_conditions:
        authorization: Only the provided dispute_resolver address matching escrow.roles.dispute_resolver
          may execute; otherwise errors.
        vector_params: No vector or list parameters.
        time_dependent: Not time-dependent; checks role, dispute flag, balances, and
          fee thresholds only.
        sentinel_values: Rejects when escrow.flags.disputed is false, approver_funds
          or receiver_funds are negative, total_funds != current_balance, approver_funds
          < fee_result.net_approver_funds, or receiver_funds < fee_result.net_receiver_funds.
      contracts/escrow/src/core/validators/dispute.rs::validate_dispute_flag_change_conditions:
        authorization: 'Signer must equal one of escrow roles: approver, service_provider,
          platform_address, release_signer, dispute_resolver, or receiver.'
        vector_params: No vector or list parameters.
        time_dependent: Not time-dependent; depends only on current dispute flag and
          signer role membership.
        sentinel_values: Rejects if escrow.flags.disputed is already true or signer
          matches none of the authorized role addresses.
  contracts/escrow/src/core/validators/escrow.rs:
    content_sha256: 7f6cb78c27f163a2024b99d5eb816008f61ec5cbab03abcfcf1e11da6545d07d
    functions:
      contracts/escrow/src/core/validators/escrow.rs::validate_release_conditions:
        authorization: Requires release_signer to equal escrow.roles.release_signer;
          otherwise rejects, and also rejects if already released, disputed, no milestones,
          or any milestone unapproved.
        vector_params: Reads escrow.milestones vector; requires it non-empty and all
          entries approved.
        time_dependent: No time-based checks.
        sentinel_values: Treats released/disputed flags, empty milestones, and milestone.approved=false
          as invalid sentinel states.
      contracts/escrow/src/core/validators/escrow.rs::validate_escrow_property_change_conditions:
        authorization: Requires platform_address to equal existing_escrow.roles.platform_address;
          otherwise rejects.
        vector_params: Iterates existing_escrow.milestones to forbid any approved
          milestone, rejects if new_escrow has any approved milestone, and limits
          existing_escrow.milestones.len() to at most 10.
        time_dependent: No time-based checks.
        sentinel_values: Rejects if existing escrow is disputed, new escrow has released/disputed/resolved
          flags set, contract_balance>0, existing_escrow.amount==0, or milestones
          exceed 10.
      contracts/escrow/src/core/validators/escrow.rs::validate_initialize_escrow_conditions:
        authorization: No caller/address authorization checks; only ensures no existing
          DataKey::Escrow instance is already stored.
        vector_params: Checks escrow_properties.milestones for any approved milestone
          and enforces milestones.len() <= 10.
        time_dependent: No time-based checks.
        sentinel_values: Rejects if escrow already initialized, any released/disputed/resolved
          flag is true, any milestone is pre-approved, platform_fee>9900, or amount==0.
      contracts/escrow/src/core/validators/escrow.rs::validate_fund_escrow_conditions:
        authorization: No caller/address authorization checks.
        vector_params: No vector-specific validation beyond full Escrow equality comparison
          between stored_escrow and expected_escrow.
        time_dependent: No time-based checks.
        sentinel_values: Rejects if amount<=0 or if stored_escrow != expected_escrow.
  contracts/escrow/src/core/validators/milestone.rs:
    content_sha256: a53348d0c3c6808349753348973bccb2c57b43170497b936afb75471d58bd67e
    functions:
      contracts/escrow/src/core/validators/milestone.rs::validate_milestone_status_change_conditions:
        authorization: Only the escrow service_provider address may change milestone
          status; otherwise returns OnlyServiceProviderChangeMilstoneStatus.
        time_dependent: No time-based checks.
        sentinel_values: Rejects when escrow.milestones is empty, or milestone_index
          is negative or >= milestones.len() as i128.
      contracts/escrow/src/core/validators/milestone.rs::validate_milestone_flag_change_conditions:
        authorization: Only the escrow approver address may change a milestone flag;
          otherwise returns OnlyApproverChangeMilstoneFlag.
        time_dependent: No time-based checks.
        sentinel_values: Rejects if milestone.approved is true, milestone.status is
          empty, escrow.milestones is empty, or milestone_index is negative or >=
          milestones.len() as i128.
