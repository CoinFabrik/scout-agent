  escrow/src/core/milestone.rs:
    content_sha256: 635338eb3e102a71dbed73e2336663cd49f8b42d1d17407b5a32e32fb4486f3b
    functions:
      escrow/src/core/milestone.rs::MilestoneManager::change_milestone_status:
        authorization: Requires auth from the `service_provider` address via `require_auth()`,
          and further validated by `validate_milestone_status_change_conditions` against
          the existing escrow.
        sentinel_values: Returns `ContractError::InvalidMileStoneIndex` if `milestone_index`
          (cast to u32) does not exist in the escrow's milestones vector.
      escrow/src/core/milestone.rs::MilestoneManager::change_milestone_approved_flag:
        authorization: Requires auth from the `approver` address via `require_auth()`,
          and further validated by `validate_milestone_flag_change_conditions` against
          the existing escrow.
        sentinel_values: Returns `ContractError::InvalidMileStoneIndex` if `milestone_index`
          (cast to u32) does not exist in the escrow's milestones vector.
  escrow/src/core/validators/dispute.rs:
    content_sha256: b1ae19368619749d94c8f7464f0d064ace58ecccb12e7c9b818bace79a57f385
    functions:
      escrow/src/core/validators/dispute.rs::validate_dispute_resolution_conditions:
        authorization: Only the designated dispute_resolver (matching escrow.roles.dispute_resolver)
          can resolve a dispute; returns OnlyDisputeResolverCanExecuteThisFunction
          otherwise.
        sentinel_values: Escrow must have flags.disputed == true; total_funds must
          equal current_balance; approver_funds must be >= fee_result.net_approver_funds;
          receiver_funds must be >= fee_result.net_receiver_funds.
      escrow/src/core/validators/dispute.rs::validate_dispute_flag_change_conditions:
        authorization: 'Signer must be one of: approver, service_provider, platform_address,
          release_signer, dispute_resolver, or receiver from escrow.roles; returns
          UnauthorizedToChangeDisputeFlag otherwise.'
        sentinel_values: Escrow flags.disputed must be false (not already in dispute);
          returns EscrowAlreadyInDispute if already disputed.
  escrow/src/core/validators/escrow.rs:
    content_sha256: 3a72b9db949259d88823d4136e11ca53fbea04d4f5b05569eab720826ad5d8bf
    functions:
      escrow/src/core/validators/escrow.rs::validate_release_conditions:
        authorization: Caller must be the escrow's designated release_signer (escrow.roles.release_signer);
          otherwise returns OnlyReleaseSignerCanReleaseEarnings.
        vector_params: Iterates over escrow.milestones vector to check that all milestones
          have approved == true.
        sentinel_values: 'Checks boolean flags: escrow.flags.released (already resolved),
          escrow.flags.disputed (dispute opened); checks milestones.is_empty() for
          no milestones defined.'
      escrow/src/core/validators/escrow.rs::validate_escrow_property_change_conditions:
        authorization: Caller must match the escrow's platform_address (existing_escrow.roles.platform_address);
          otherwise returns OnlyPlatformAddressExecuteThisFunction.
        vector_params: Iterates over existing_escrow.milestones vector to ensure none
          have approved == true.
        sentinel_values: contract_balance > 0 is treated as a sentinel indicating
          escrow has funds and changes are blocked; escrow.flags.disputed == true
          blocks changes.
      escrow/src/core/validators/escrow.rs::validate_initialize_escrow_conditions:
        vector_params: Checks escrow_properties.milestones.len() must not exceed 10;
          returns TooManyMilestones if exceeded.
        sentinel_values: escrow_properties.amount == 0 is rejected as AmountCannotBeZero;
          existence of DataKey::Escrow in instance storage signals already initialized.
  escrow/src/core/validators/milestone.rs:
    content_sha256: 0e075b50bd9e87a7088b54026db5a59ebf2330ab92e6f81b894f2223238c54ff
    functions:
      escrow/src/core/validators/milestone.rs::validate_milestone_status_change_conditions:
        authorization: Caller must be the escrow's service_provider; returns OnlyServiceProviderChangeMilstoneStatus
          otherwise.
        sentinel_values: milestone_index < 0 or >= milestones.len() returns InvalidMileStoneIndex;
          empty milestones vec returns NoMileStoneDefined.
      escrow/src/core/validators/milestone.rs::validate_milestone_flag_change_conditions:
        authorization: Caller must be the escrow's approver; returns OnlyApproverChangeMilstoneFlag
          otherwise.
        sentinel_values: milestone_index < 0 or >= milestones.len() returns InvalidMileStoneIndex;
          empty milestones vec returns NoMileStoneDefined.
