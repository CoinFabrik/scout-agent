functions:
  oracle/src/prices.rs::normalize_price_data:
    time_dependent: Converts the provided timestamp from milliseconds to seconds.
  oracle/src/prices.rs::obtain_last_record_timestamp:
    time_dependent: Retrieves the current ledger timestamp and compares it to the
      last recorded timestamp to ensure validity.
    sentinel_values: Returns 0 if no prices exist, the last timestamp is in the future,
      or the last timestamp is too far in the past.
  oracle/src/prices.rs::retrieve_asset_price_data:
    time_dependent: Calculates the period difference between the last timestamp and
      the target timestamp based on system resolution.
    sentinel_values: Returns None if the period exceeds 255, the last timestamp is
      older than requested, or no record is found.
  oracle/src/prices.rs::extract_update_record_prices:
    vector_params: Iterates through the price update record to build and return a
      Vec of extracted integer prices.
    sentinel_values: Defaults the pushed price to 0 if the asset index is not marked
      as updated in the bitmask.
  oracle/src/prices.rs::extract_single_update_record_price:
    sentinel_values: Returns 0 if the required asset price cannot be found in the
      update mask.
  oracle/src/prices.rs::get_last_timestamp:
    time_dependent: Loads the most recent timestamp marker from instance storage.
    sentinel_values: Returns a default value (0) if the LAST_TIMESTAMP_KEY is not
      found.
  oracle/src/prices.rs::set_last_timestamp:
    time_dependent: Stores the latest timestamp into the contract's instance storage.
  oracle/src/prices.rs::get_history_map:
    sentinel_values: Returns an empty Bytes object if the HISTORY_KEY is absent from
      instance storage.
  oracle/src/prices.rs::update_history_mask:
    vector_params: Accepts a Vec of prices to update the history mask and dynamically
      creates a Vec of empty prices for missing intervals.
    time_dependent: Calculates the delta in updates using the provided timestamp,
      the last timestamp, and the configured time resolution.
    sentinel_values: Uses 0i128 as the default empty price for tracking missing historical
      update intervals.
  oracle/src/prices.rs::has_price:
    time_dependent: Checks the history map for updates corresponding to a specific
      number of periods ago.
  oracle/src/prices.rs::load_history_record:
    time_dependent: Fetches a price update record matched by its specific timestamp.
    sentinel_values: Returns None if the record matching the timestamp is not in the
      cache or temporary storage.
  oracle/src/prices.rs::store_prices:
    vector_params: Takes a Vec of legacy prices (update_v1) for backward compatibility
      processing.
    time_dependent: Updates the last timestamp, stores price records, and calculates
      a TTL retention period extension in ledgers.
  oracle/src/prices.rs::load_prices:
    vector_params: Populates and returns a Vec of PriceData, limited to a maximum
      of 20 elements.
    time_dependent: Iteratively fetches prices, stepping backward through time by
      subtracting the resolution from the timestamp.
    sentinel_values: Returns None if the initial timestamp is 0 or if the constructed
      price vector remains empty.
  oracle/src/prices.rs::calculate_twap:
    time_dependent: Verifies that the oldest loaded price is not considered too old
      compared to the current ledger timestamp and resolution.
    sentinel_values: Returns None if fetching prices fails, the record count is incorrect,
      or the oldest price has expired.
  oracle/src/prices.rs::load_cross_price:
    time_dependent: Retrieves the corresponding asset prices specifically for the
      given timestamp to compute a cross rate.
    sentinel_values: Returns a dummy value of 10 raised to the decimals if the base
      and quote assets are identical, or None if either price is missing.
  oracle/src/prices.rs::load_price_records_cache:
    vector_params: Returns an Option containing a Vec of tupled timestamps and price
      updates representing the cache.
    sentinel_values: Returns None if no cache data exists under the CACHE_KEY.
  oracle/src/prices.rs::store_price_v1:
    vector_params: Iterates through a Vec of legacy price updates to store them individually.
    time_dependent: Formats storage keys utilizing the provided timestamp and extends
      the time-to-live for stored entries.
    sentinel_values: Ignores prices that are 0, continuing to the next iteration.
  oracle/src/prices.rs::get_price_v1:
    time_dependent: Loads a legacy price from temporary storage utilizing the requested
      timestamp.
    sentinel_values: Returns None if the legacy price key is missing.
  oracle/src/prices.rs::format_price_key_v1:
    time_dependent: Embeds the timestamp into the upper bits of a u128 to format a
      legacy storage key.
  oracle/src/prices.rs::fixed_div_floor:
    sentinel_values: Panics with 'invalid division arguments' if either the dividend
      or divisor is less than or equal to 0.
