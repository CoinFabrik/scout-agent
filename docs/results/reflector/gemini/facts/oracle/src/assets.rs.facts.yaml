    time_dependent: Calculates an extension bump based on fee limits and adds it to
      either the current ledger time or existing expiration.
    sentinel_values: Panics on invalid amount, missing asset, or invalid config; treats
      uninitialized/past expirations as current time.
  oracle/src/assets.rs::load_expiration_records:
    vector_params: Fetches and returns the stored Vec of u64 expiration records.
    sentinel_values: Yields an empty Vec if no expiration records are located in storage.
  oracle/src/assets.rs::set_expirations_records:
