  oracle/src/assets.rs::resolve_asset_index:
    sentinel_values: Returns None if the provided asset cannot be found in storage.
  oracle/src/assets.rs::resolve_asset_pair_indexes:
    sentinel_values: Returns None if either the base or quote asset index cannot be
      resolved.
  oracle/src/assets.rs::add_assets:
    vector_params: Iterates through the provided assets Vec to register each, pushing
      to asset and expiration Vecs.
    time_dependent: Uses ledger time to derive and store expiration timestamps for
      new assets.
    sentinel_values: Panics if an asset already exists or if the total asset count
      exceeds ASSET_LIMIT.
  oracle/src/assets.rs::expires:
    vector_params: Fetches a specific value from the expiration records Vec using
      the resolved index.
    time_dependent: Provides the expiration timestamp value corresponding to an asset.
    sentinel_values: Panics if the asset is missing from storage.
  oracle/src/assets.rs::init_expiration_config:
    vector_params: Populates and stores the expiration records Vec based on the length
      of the assets list.
    time_dependent: Computes default expiration timestamps derived from current ledger
      time.
    sentinel_values: Returns early without making changes if expiration records are
      already initialized.
  oracle/src/assets.rs::extend_ttl:
    authorization: Burns tokens from the sponsor address, delegating authorization
