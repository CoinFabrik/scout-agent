        time_dependent: Stores the latest timestamp into the contract's instance storage.
      oracle/src/prices.rs::get_history_map:
        sentinel_values: Returns an empty Bytes object if the HISTORY_KEY is absent
          from instance storage.
      oracle/src/prices.rs::update_history_mask:
        vector_params: Accepts a Vec of prices to update the history mask and dynamically
          creates a Vec of empty prices for missing intervals.
        time_dependent: Calculates the delta in updates using the provided timestamp,
          the last timestamp, and the configured time resolution.
        sentinel_values: Uses 0i128 as the default empty price for tracking missing
          historical update intervals.
      oracle/src/prices.rs::has_price:
        time_dependent: Checks the history map for updates corresponding to a specific
          number of periods ago.
      oracle/src/prices.rs::load_history_record:
        time_dependent: Fetches a price update record matched by its specific timestamp.
        sentinel_values: Returns None if the record matching the timestamp is not
          in the cache or temporary storage.
      oracle/src/prices.rs::store_prices:
        vector_params: Takes a Vec of legacy prices (update_v1) for backward compatibility
          processing.
        time_dependent: Updates the last timestamp, stores price records, and calculates
          a TTL retention period extension in ledgers.
      oracle/src/prices.rs::load_prices:
        vector_params: Populates and returns a Vec of PriceData, limited to a maximum
          of 20 elements.
        time_dependent: Iteratively fetches prices, stepping backward through time
          by subtracting the resolution from the timestamp.
        sentinel_values: Returns None if the initial timestamp is 0 or if the constructed
          price vector remains empty.
      oracle/src/prices.rs::calculate_twap:
        time_dependent: Verifies that the oldest loaded price is not considered too
          old compared to the current ledger timestamp and resolution.
        sentinel_values: Returns None if fetching prices fails, the record count is
          incorrect, or the oldest price has expired.
      oracle/src/prices.rs::load_cross_price:
        time_dependent: Retrieves the corresponding asset prices specifically for
