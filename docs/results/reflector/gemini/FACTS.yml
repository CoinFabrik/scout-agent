        sentinel_values: Returns None if no cache data exists under the CACHE_KEY.
      oracle/src/prices.rs::store_price_v1:
        vector_params: Iterates through a Vec of legacy price updates to store them
          individually.
        time_dependent: Formats storage keys utilizing the provided timestamp and
          extends the time-to-live for stored entries.
        sentinel_values: Ignores prices that are 0, continuing to the next iteration.
      oracle/src/prices.rs::get_price_v1:
        time_dependent: Loads a legacy price from temporary storage utilizing the
