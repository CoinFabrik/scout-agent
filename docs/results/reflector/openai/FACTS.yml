      oracle/src/assets.rs::add_assets:
        authorization: No caller authorization checks in this function.
        vector_params: Takes Vec<Asset> and appends each asset to stored asset_list;
          may also push matching expiration entries.
        time_dependent: Yes; computes a single expiration timestamp from current ledger
          time via initial_expiration_period for all newly added assets when fee config
