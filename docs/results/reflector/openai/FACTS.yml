        vector_params: Returns a Vec<Asset>; no vector input parameters.
        time_dependent: No.
        sentinel_values: None indicated; returns Vec<Asset> directly.
      pulse-contract/src/lib.rs::PulseOracleContract::last_timestamp:
        authorization: No explicit authorization in this file; public read-only wrapper
          delegating to PriceOracleContractBase::last_timestamp.
        time_dependent: Yes; exposes most recent price update timestamp.
        sentinel_values: None indicated; returns u64 directly.
      pulse-contract/src/lib.rs::PulseOracleContract::version:
        authorization: No explicit authorization in this file; public read-only wrapper
