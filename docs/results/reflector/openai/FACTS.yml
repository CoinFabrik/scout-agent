        vector_params: No vector parameters; reads from stored expiration Vec<u64>.
        time_dependent: No direct time dependency; only returns stored expiration
          value.
        sentinel_values: Panics with AssetMissing if asset index is absent; returns
          Option<u64> and may be None if the expirations vector has no entry at that
          index.
      oracle/src/assets.rs::init_expiration_config:
        authorization: No authorization checks.
        vector_params: No vector parameters; fills the expiration records Vec<u64>
          with one entry per existing asset.
        time_dependent: Yes; computes expiration from current ledger timestamp and
          initial_expiration_period.
        sentinel_values: Returns early if expiration_records already nonempty; inserted
          expiration may be 0 if initial_expiration_period is 0.
      oracle/src/assets.rs::extend_ttl:
        authorization: No explicit require_auth call here; burns tokens from provided
