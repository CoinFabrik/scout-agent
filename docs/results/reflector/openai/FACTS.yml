        time_dependent: No.
        sentinel_values: None indicated; returns u32 directly.
      pulse-contract/src/lib.rs::PulseOracleContract::resolution:
        authorization: No explicit authorization in this file; public read-only wrapper
          delegating to PriceOracleContractBase::resolution.
        time_dependent: No.
        sentinel_values: None indicated; returns u32 directly.
      pulse-contract/src/lib.rs::PulseOracleContract::history_retention_period:
        authorization: No explicit authorization in this file; public read-only wrapper
          delegating to PriceOracleContractBase::history_retention_period.
        time_dependent: No.
        sentinel_values: Optional return; None if no retention period is configured.
      pulse-contract/src/lib.rs::PulseOracleContract::cache_size:
        authorization: No explicit authorization in this file; public read-only wrapper
          delegating to PriceOracleContractBase::cache_size.
        time_dependent: No.
        sentinel_values: None indicated; returns u32 directly.
      pulse-contract/src/lib.rs::PulseOracleContract::assets:
        authorization: No explicit authorization in this file; public read-only wrapper
