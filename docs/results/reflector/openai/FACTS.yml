    functions:
      oracle/src/mapping.rs::update_history_mask:
        authorization: No authorization checks; callable with provided Env, history_mask,
          and updates.
        vector_params: 'Takes updates: &Vec<i128>; iterates all entries by asset index
          and price to update each asset''s 32-byte history record.'
        time_dependent: Period progression is implicit only via shifting the stored
          256-bit mask left by 1 each call; no direct timestamp or ledger-time reads.
        sentinel_values: Treats missing prior asset record as zero U256; only prices
          > 0 set the new lowest bit, while price <= 0 leaves it unset; older than
          256 periods are evicted by shift.
      oracle/src/mapping.rs::check_history_updated:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: No direct time access; period is a caller-supplied u32 used
          to select a historical bit position.
        sentinel_values: Uses unwrap_or_default() so absent byte reads as 0, causing
          false; bitmask is 1 << (period % 8).
      oracle/src/mapping.rs::check_period_updated:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: No time-dependent behavior.
        sentinel_values: Uses unwrap_or_default() so missing byte reads as 0 and returns
          false; checks resolved bitmask for the asset index.
      oracle/src/mapping.rs::resolve_period_update_mask_position:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: No time-dependent behavior.
        sentinel_values: No special sentinel handling; derives byte = asset_index
          / 8 and bitmask = 1 << (asset_index % 8).
