    content_sha256: 8c64a9f40b79da378a4bd2fb60b47b015e4600ce8cee2d5be9d083044c8db578
    functions:
      beam-contract/src/cost.rs::set_costs_config:
        authorization: No authorization checks; writes provided costs vector to instance
          storage under COST_CONFIG_KEY.
        vector_params: 'costs: &Vec<u64> stored directly; expected indexes correspond
          to InvocationComplexity.'
        time_dependent: No time-dependent logic.
        sentinel_values: No explicit sentinels; overwrites storage key "cost" with
          any provided vector.
      beam-contract/src/cost.rs::load_costs_config:
        authorization: No authorization checks; reads instance storage for COST_CONFIG_KEY.
        vector_params: Returns Vec<u64>; if missing, returns default vector [2_000_000,
          10_000_000, 15_000_000, 20_000_000, 30_000_000] indexed by InvocationComplexity.
        time_dependent: No time-dependent logic.
        sentinel_values: Missing storage value is the sentinel, triggering the default
          cost vector via unwrap_or_else.
      beam-contract/src/cost.rs::charge_invocation_fee:
        authorization: No auth check beyond using caller as burn target; only burns
          when settings::get_fee_config returns FeeConfig::Some((fee_token, _)).
        vector_params: No vector parameters.
        time_dependent: Uses periods input to influence cost through estimate_invocation_cost,
          but no block/time lookup.
        sentinel_values: FeeConfig::None skips charging; estimated cost <= 0 returns
          early without burn.
      beam-contract/src/cost.rs::estimate_invocation_cost:
        authorization: No authorization checks; pure cost computation gated only by
          fee_config value.
        vector_params: Loads costs Vec<u64> from config and indexes it by invocation
          enum value; also reads NModifier entry for per-period scaling.
        time_dependent: Uses periods count for scaling when periods > 1; no actual
          time/block dependency.
        sentinel_values: FeeConfig::None returns 0; missing/invalid cost entries use
          unwrap_or_default() => 0; base cost < 1 returns 0; nonpositive period modifier
          disables scaling.
