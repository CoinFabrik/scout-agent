      oracle/src/prices.rs::get_history_map:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent; reads stored history mask bytes.
        sentinel_values: Returns empty Bytes when HISTORY_KEY is absent.
      oracle/src/prices.rs::update_history_mask:
        authorization: No authorization checks.
        vector_params: Consumes prices Vec<i128> and, for gaps greater than one interval,
          creates same-length zero-filled vectors before appending the current prices
          mask.
        time_dependent: Uses last timestamp, provided timestamp, and configured resolution
          to compute missing update intervals.
        sentinel_values: Uses 0-filled price vectors as sentinels for missing intervals;
          treats last_timestamp 0 or non-increasing timestamp as zero delta.
      oracle/src/prices.rs::has_price:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Checks history map for an asset at a given periods_ago offset.
        sentinel_values: No explicit sentinel values; returns false when history mask
          lacks the bit.
      oracle/src/prices.rs::load_history_record:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Loads a PriceUpdate for the given timestamp, checking cached
          (timestamp, PriceUpdate) records before temporary storage.
        sentinel_values: Returns None if neither cache nor temporary storage contains
          the timestamp.
      oracle/src/prices.rs::store_prices:
        authorization: No authorization checks.
        vector_params: Takes legacy update_v1 Vec<i128> and may pass it to store_price_v1;
          also maintains a bounded cached Vec<(u64, PriceUpdate)> trimmed to configured
          cache_size.
        time_dependent: Updates last timestamp only if the new timestamp is greater,
          stores record under timestamp, and derives TTL ledgers from history retention
          period; legacy storage mirrors data when protocol is not latest.
        sentinel_values: cache_size 0 disables cache writes; TTL extension only occurs
          when ledgers_to_live > 16.
      oracle/src/prices.rs::load_prices:
        authorization: No authorization checks.
        vector_params: Returns a Vec<PriceData> built by repeated callback fetches,
          capping requested records at 20.
        time_dependent: Starts from obtain_last_record_timestamp and steps backward
          by configured resolution until records are exhausted or timestamp < resolution.
        sentinel_values: Returns None if starting timestamp is 0 or if no prices were
          collected; record request is clamped to 20.
      oracle/src/prices.rs::calculate_twap:
        authorization: No authorization checks.
        vector_params: No vector parameters directly; depends on load_prices returning
          a Vec<PriceData> of exactly records length.
        time_dependent: Uses resolution and current ledger timestamp; rejects if the
          newest loaded price timestamp (converted back to ms) is older than resolution
          plus 60 seconds relative to current time.
        sentinel_values: Returns None if load_prices fails, if loaded count differs
          from requested records, or if the latest price is stale.
      oracle/src/prices.rs::load_cross_price:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Loads both asset prices at the provided timestamp and normalizes
          the resulting cross price timestamp to seconds.
        sentinel_values: Returns normalized 10^decimals when base and quote assets
          are identical; otherwise returns None if either underlying price is missing.
      oracle/src/prices.rs::load_price_records_cache:
        authorization: No authorization checks.
        vector_params: No vector parameters; returns cached Vec<(u64, PriceUpdate)>
          from instance storage.
        time_dependent: Not time-dependent.
        sentinel_values: Returns None when CACHE_KEY is absent.
      oracle/src/prices.rs::store_price_v1:
        authorization: No authorization checks.
        vector_params: Iterates over updates Vec<i128>, storing each nonzero price
          under a legacy per-asset key.
        time_dependent: Stores values at the provided timestamp and optionally extends
          TTL using ledgers_to_live.
        sentinel_values: Skips prices equal to 0; TTL extension only occurs when ledgers_to_live
          > 16.
      oracle/src/prices.rs::get_price_v1:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Loads legacy price for the given asset and timestamp from
          temporary storage.
        sentinel_values: Returns None when the legacy key is absent.
      oracle/src/prices.rs::format_price_key_v1:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Combines timestamp and asset into a legacy key; timestamp
          occupies the high 64 bits.
        sentinel_values: No sentinel handling.
      oracle/src/prices.rs::fixed_div_floor:
        authorization: No authorization checks.
        vector_params: No vector parameters.
        time_dependent: Not time-dependent.
        sentinel_values: Panics if dividend <= 0 or divisor <= 0; uses decimal-based
          scaling shifts, with zero shifts meaning no adjustment.
  oracle/src/protocol.rs:
    content_sha256: 8fb294d074e5d88f8c81e91e91a2d3b37c156a200e2d567571fc095b33419384
    functions:
      oracle/src/protocol.rs::get_protocol_version:
        authorization: No authorization checks; reads instance storage key "protocol"
          from Env.
        time_dependent: No time-dependent logic.
        sentinel_values: Defaults to 1 via unwrap_or(1) when "protocol" is unset.
      oracle/src/protocol.rs::set_protocol_version:
        authorization: No authorization checks; writes provided protocol value to
          instance storage key "protocol".
        time_dependent: No time-dependent logic.
        sentinel_values: No sentinel handling in this function.
      oracle/src/protocol.rs::at_latest_protocol_version:
        authorization: No authorization checks; reads protocol version and may trigger
          private upgrade scheduling.
        time_dependent: Indirectly time-dependent through schedule_update when current
          version is not CURRENT_PROTOCOL.
        sentinel_values: Compares against CURRENT_PROTOCOL=2; otherwise delegates
          to schedule_update.
      oracle/src/protocol.rs::schedule_update:
        authorization: No authorization checks; reads/writes instance storage to schedule
          or finalize protocol upgrade.
        time_dependent: Depends on current ledger timestamp and upgrades only when
          scheduled_update_ts + days_to_milliseconds(1) < ledger_timestamp.
        sentinel_values: Uses scheduled_update_ts 0 as unset/reset sentinel; sets
          timestamp to current ledger time when 0 and resets to 0 after upgrading
          to CURRENT_PROTOCOL=2.
      oracle/src/protocol.rs::set_protocol_upgrade_timestamp:
        authorization: No authorization checks; writes provided timestamp to instance
          storage key "protocol_update".
        time_dependent: Only stores a timestamp value; no direct time comparison.
        sentinel_values: Caller uses timestamp 0 as reset/unset sentinel, but this
          function only writes the provided value.
  oracle/src/settings.rs:
    content_sha256: ee4146820cb0ed6c286f2b83466d9e7332a795ffd3851709059f7f4c45b730b5
    functions:
      oracle/src/settings.rs::init:
        authorization: No explicit authorization; callable only once, panics with
          AlreadyInitialized if RETENTION_PERIOD_KEY already exists.
        time_dependent: No time-based logic; only stores provided history_retention_period
          value.
        sentinel_values: Uses presence of RETENTION_PERIOD_KEY as initialization sentinel;
          delegates fee defaulting to get_fee_config only indirectly.
      oracle/src/settings.rs::get_base_asset:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: None; unwraps stored BASE_KEY and will panic if unset.
      oracle/src/settings.rs::get_decimals:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: None; unwraps stored DECIMALS_KEY and will panic if unset.
      oracle/src/settings.rs::get_resolution:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: None; unwraps stored RESOLUTION_KEY and will panic if unset.
      oracle/src/settings.rs::set_resolution:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: None; directly stores provided resolution.
      oracle/src/settings.rs::get_history_retention_period:
        authorization: No authorization checks.
        time_dependent: Not time-dependent; returns configured retention period value.
        sentinel_values: Returns default u64 value 0 when RETENTION_PERIOD_KEY is
          absent via unwrap_or_default.
      oracle/src/settings.rs::set_history_retention_period:
        authorization: No authorization checks.
        time_dependent: Not time-dependent; only stores the provided retention_period.
        sentinel_values: None; directly stores provided retention_period.
      oracle/src/settings.rs::get_cache_size:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: Returns sentinel/default cache size 2 if CACHE_SIZE_KEY is
          absent.
      oracle/src/settings.rs::set_cache_size:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: None; directly stores provided cache_size.
      oracle/src/settings.rs::set_fee_config:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: None; directly stores provided FeeConfig under RETENTION_KEY.
      oracle/src/settings.rs::get_fee_config:
        authorization: No authorization checks.
        time_dependent: Not time-dependent.
        sentinel_values: If RETENTION_KEY is absent, returns default FeeConfig::Some((Address::from_str(e,
          XRF_TOKEN_ADDRESS), DEFAULT_RETENTION_FEE)) using hardcoded token address
          and fee.
  oracle/src/timestamps.rs:
    content_sha256: 2e48a47ad4683b6edaeb8f06ddca41487dc70505ba32b2f7a6fb7803ba48a6ca
    functions:
      oracle/src/timestamps.rs::normalize:
        time_dependent: indirectly depends on current settings resolution from Env
          via settings::get_resolution(e), not on ledger time
        sentinel_values: returns 0 if value == 0 or timeframe resolution == 0
      oracle/src/timestamps.rs::is_valid:
        time_dependent: indirectly depends on current settings resolution from Env
          through normalize(e, value), not on ledger time
        sentinel_values: treats values as valid when value equals normalize(e, value);
          with zero resolution normalize returns 0 so only value 0 is valid
      oracle/src/timestamps.rs::days_to_milliseconds: {}
      oracle/src/timestamps.rs::ledger_timestamp:
        time_dependent: reads current ledger timestamp from Env and converts seconds
          to milliseconds
  oracle/src/types.rs:
    content_sha256: f0ab18c153ed80b9b5d8a5b2d7f2d609345ecd66852191b58fc5a9534509305b
    functions: {}
