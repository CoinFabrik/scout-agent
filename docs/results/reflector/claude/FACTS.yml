    functions:
      oracle/src/events.rs::publish_update_event:
        vector_params: Takes `updates` (Vec<i128> of prices) and `all_assets` (Vec<Asset>
          of all registered assets); iterates over all_assets and pairs each with
          its corresponding price from updates by index.
        time_dependent: 'Accepts a `timestamp: u64` parameter that is included as
          a topic in the published UpdateEvent.'
        sentinel_values: Prices equal to 0 are treated as absent/invalid and skipped
          (not included in the published event); `unwrap_or_default()` returns 0 for
          out-of-bounds indices, which are also skipped.
