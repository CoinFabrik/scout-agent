      beam-contract/src/cost.rs::set_costs_config:
        vector_params: 'costs: Vec<u64> storing invocation cost rates indexed by InvocationComplexity
          enum variants (NModifier=0, Price=1, Twap=2, CrossPrice=3, CrossTwap=4)'
      beam-contract/src/cost.rs::load_costs_config:
        vector_params: Returns Vec<u64> of cost rates indexed by InvocationComplexity;
          defaults to [2_000_000, 10_000_000, 15_000_000, 20_000_000, 30_000_000]
          if not set in storage
        sentinel_values: Returns a hardcoded default Vec [2_000_000, 10_000_000, 15_000_000,
          20_000_000, 30_000_000] when storage key "cost" is absent
      beam-contract/src/cost.rs::charge_invocation_fee:
        sentinel_values: Returns early (no charge) if fee_config is FeeConfig::None
          or if the estimated cost is <= 0
      beam-contract/src/cost.rs::estimate_invocation_cost:
        sentinel_values: Returns 0 when fee_config is FeeConfig::None, when the base
          cost from the costs vector is < 1, or when the cost entry is missing (unwrap_or_default);
          uses SCALE constant 10_000_000 for period modifier arithmetic
