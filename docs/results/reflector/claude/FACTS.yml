    functions: {}
  oracle/src/mapping.rs:
    content_sha256: 793f1a17a8eeaddc0f0950790ecf846584a201b1186ca72bc18f9a16dc146ab3
    functions:
      oracle/src/mapping.rs::update_history_mask:
        vector_params: 'Takes `updates: &Vec<i128>` where each element represents
          a price for an asset at the corresponding index; iterated via enumerate
          to update each asset''s bitmask slice.'
        time_dependent: Maintains a rolling 256-period bitmask per asset; each call
          left-shifts existing bits by 1 (evicting periods older than 256) and sets
          the lowest bit if the price is positive.
        sentinel_values: A price value of 0 or less is treated as "no price found"
          and the corresponding bit is not set; U256 initialized to 0 when no previous
          records exist for an asset.
      oracle/src/mapping.rs::check_history_updated:
        time_dependent: Checks whether a specific past period (0-255) has a recorded
          price update for a given asset by inspecting the corresponding bit in the
          history bitmask.
        sentinel_values: Returns false by default if the byte at the computed position
          is missing (unwrap_or_default returns 0).
      oracle/src/mapping.rs::check_period_updated:
        sentinel_values: Returns false by default if the byte at the computed position
          is missing (unwrap_or_default returns 0).
      oracle/src/mapping.rs::resolve_period_update_mask_position: {}
