        vector_params: "assets: Vec<Asset> \u2014 list of assets to add to the quoted\
          \ assets list."
        time_dependent: Uses INITIAL_EXPIRATION_PERIOD (180 days) for new asset TTL.
      pulse-contract/src/lib.rs::PulseOracleContract::set_history_retention_period:
        authorization: Requires admin authorization; panics if not authorized.
        time_dependent: Sets the history retention period (in seconds) for stored
          price records.
      pulse-contract/src/lib.rs::PulseOracleContract::set_fee_config:
        authorization: Requires admin authorization; panics if not authorized or not
          initialized.
        time_dependent: Uses INITIAL_EXPIRATION_PERIOD (180 days) when setting fee
          config.
      pulse-contract/src/lib.rs::PulseOracleContract::set_price:
        authorization: Requires admin authorization; panics if not authorized.
        time_dependent: Records a price feed snapshot at the given timestamp.
      pulse-contract/src/lib.rs::PulseOracleContract::update_contract:
        authorization: Requires admin authorization; panics if not authorized.
