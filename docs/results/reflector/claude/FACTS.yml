    content_sha256: 6ea79d4a884bbb207707ddc2d2e7b68198f9933ff0bcbae8bd64d0115a62ec67
    functions:
      pulse-contract/src/lib.rs::PulseOracleContract::base: {}
      pulse-contract/src/lib.rs::PulseOracleContract::decimals: {}
      pulse-contract/src/lib.rs::PulseOracleContract::resolution: {}
      pulse-contract/src/lib.rs::PulseOracleContract::history_retention_period:
        sentinel_values: Returns None if history retention period is not configured.
      pulse-contract/src/lib.rs::PulseOracleContract::cache_size: {}
      pulse-contract/src/lib.rs::PulseOracleContract::assets: {}
      pulse-contract/src/lib.rs::PulseOracleContract::last_timestamp:
        time_dependent: Returns the timestamp (in seconds) of the most recent price
          update.
      pulse-contract/src/lib.rs::PulseOracleContract::version: {}
      pulse-contract/src/lib.rs::PulseOracleContract::expires:
        time_dependent: Returns the expiration timestamp for a given asset.
        sentinel_values: Returns None if the asset is not supported.
      pulse-contract/src/lib.rs::PulseOracleContract::extend_asset_ttl:
        authorization: Requires sponsor address authorization (sponsor is passed as
          parameter); sponsor pays tokens to extend TTL.
        time_dependent: Extends asset expiration using INITIAL_EXPIRATION_PERIOD (180
          days).
      pulse-contract/src/lib.rs::PulseOracleContract::fee_config: {}
      pulse-contract/src/lib.rs::PulseOracleContract::admin:
        sentinel_values: Returns None if no admin is set.
      pulse-contract/src/lib.rs::PulseOracleContract::price:
        time_dependent: Looks up a price record at a specific timestamp (in seconds).
        sentinel_values: Returns None if no price record found for the asset at the
          given timestamp.
      pulse-contract/src/lib.rs::PulseOracleContract::lastprice:
        time_dependent: Returns the most recent price for the asset.
        sentinel_values: Returns None if the asset is not supported.
      pulse-contract/src/lib.rs::PulseOracleContract::prices:
        time_dependent: Returns last N price records for the given asset.
        sentinel_values: Returns None if the asset is not supported.
      pulse-contract/src/lib.rs::PulseOracleContract::x_last_price:
        time_dependent: Returns the most recent cross price for the asset pair.
        sentinel_values: Returns None if no records found for the quoted assets.
      pulse-contract/src/lib.rs::PulseOracleContract::x_price:
        time_dependent: Returns cross price (base/quote) at a specific timestamp.
        sentinel_values: Returns None if no records found for the quoted assets at
          the given timestamp.
      pulse-contract/src/lib.rs::PulseOracleContract::x_prices:
        time_dependent: Returns last N cross price records for the asset pair.
        sentinel_values: Returns None if no records found for the quoted assets.
      pulse-contract/src/lib.rs::PulseOracleContract::twap:
        time_dependent: Computes time-weighted average price over N recent records.
        sentinel_values: Returns None if the asset is not supported.
      pulse-contract/src/lib.rs::PulseOracleContract::x_twap:
        time_dependent: Computes time-weighted average cross price (base/quote) over
          N recent records.
        sentinel_values: Returns None if the assets are not supported.
      pulse-contract/src/lib.rs::PulseOracleContract::config:
        authorization: Requires admin authorization; panics if not authorized.
        time_dependent: Uses INITIAL_EXPIRATION_PERIOD (180 days) for initial asset
          TTL setup.
      pulse-contract/src/lib.rs::PulseOracleContract::set_cache_size:
        authorization: Requires admin authorization; panics if not authorized.
