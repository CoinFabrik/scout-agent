  oracle/src/assets.rs:
    content_sha256: 0f59c21fec841bf0d949b77f1d4ad3b6d344a6f4b551e9742c7d92cc2dea384c
    functions:
      oracle/src/assets.rs::get_expiration_timestamp:
        time_dependent: Computes expiration timestamp by adding initial_expiration_period
          (converted from days to milliseconds) to the current ledger timestamp; returns
          0 if initial_expiration_period is 0.
        sentinel_values: Returns 0u64 when initial_expiration_period is 0, indicating
          no expiration.
      oracle/src/assets.rs::load_all_assets:
        sentinel_values: Returns an empty Vec<Asset> if the ASSETS_KEY is not found
          in instance storage.
      oracle/src/assets.rs::resolve_asset_index:
        sentinel_values: Returns None if the asset (Stellar address or Other symbol)
          is not found in instance storage.
      oracle/src/assets.rs::resolve_asset_pair_indexes:
        sentinel_values: Returns None if either the base_asset or quote_asset index
          cannot be resolved.
      oracle/src/assets.rs::add_assets:
        vector_params: Takes a Vec<Asset> of new assets to add; iterates over each,
          appending to the stored asset list and expiration records vector.
        time_dependent: Computes an expiration timestamp based on the current ledger
          timestamp plus initial_expiration_period (in days) for each new asset when
          fee config is set.
        sentinel_values: Panics with AssetAlreadyExists if an asset index already
          exists; panics with AssetLimitExceeded if total assets reach ASSET_LIMIT
          (1000). Expiration is only set when fee config is configured and expiration_timestamp
          > 0.
      oracle/src/assets.rs::expires:
        sentinel_values: Panics with AssetMissing if the asset index is not found;
          returns None if no expiration record exists at the asset's index.
      oracle/src/assets.rs::init_expiration_config:
        time_dependent: Computes a default expiration timestamp from current ledger
          timestamp plus initial_expiration_period (in days) and applies it to all
          existing assets.
        sentinel_values: Returns early (no-op) if expiration records already have
          entries (len > 0).
      oracle/src/assets.rs::extend_ttl:
        authorization: Burns fee tokens from the sponsor address via TokenClient::burn;
          sponsor must have authorized the burn.
        time_dependent: Uses current ledger timestamp to reset expired/unset asset
          expirations to now before adding the bump period; bump is calculated as
          amount * 86400000 / fee (milliseconds).
        sentinel_values: Panics with InvalidAmount if amount <= 0 or computed bump
          <= 0; panics with AssetMissing if asset not found; panics with InvalidConfigVersion
          if fee config is None or fee <= 0. Treats asset_expiration of 0 or less
          than now as expired, resetting to current timestamp.
      oracle/src/assets.rs::load_expiration_records:
        sentinel_values: Returns an empty Vec<u64> if the EXPIRATION_KEY is not found
          in instance storage.
      oracle/src/assets.rs::set_expirations_records:
        vector_params: Accepts a Vec<u64> of expiration timestamps and writes it to
          instance storage under EXPIRATION_KEY.
      oracle/src/assets.rs::set_asset_index: {}
