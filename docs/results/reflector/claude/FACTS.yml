  oracle/src/prices.rs:
    content_sha256: 2c492e564bfb6a4f57a337b17d4361949cecf676f19df6f5c959d03199640cf3
    functions:
      oracle/src/prices.rs::normalize_price_data:
        time_dependent: Converts the timestamp from milliseconds to seconds (divides
          by 1000) when constructing PriceData.
      oracle/src/prices.rs::obtain_last_record_timestamp:
        time_dependent: Returns 0 if last_timestamp is 0, is in the future relative
          to ledger time, or is older than 2*resolution from ledger time; otherwise
          returns last_timestamp.
        sentinel_values: Returns 0 as a sentinel indicating no valid last record timestamp
          is available.
      oracle/src/prices.rs::retrieve_asset_price_data:
        time_dependent: Computes period offset from last timestamp using resolution;
          returns None if period exceeds 255 or timestamp is after last recorded timestamp.
        sentinel_values: Returns None if protocol is legacy and v1 price is missing,
          if timestamp is after last, if period > 255, if no price in history mask,
          or if no history record found.
      oracle/src/prices.rs::extract_update_record_prices:
        vector_params: Returns a Vec<i128> of length `total`; iterates over asset
          indices 0..total, extracting prices from update.prices for assets marked
          in update.mask, inserting 0 for unmarked assets.
        sentinel_values: Uses 0 as the default price for assets not marked as updated
          in the mask.
      oracle/src/prices.rs::extract_single_update_record_price:
        sentinel_values: Returns 0 if the asset_index is not marked as updated in
          update.mask.
      oracle/src/prices.rs::get_last_timestamp:
        time_dependent: Reads the last update timestamp from instance storage.
        sentinel_values: Returns 0 (unwrap_or_default) if no last timestamp has been
          stored.
      oracle/src/prices.rs::set_last_timestamp:
        time_dependent: Stores the given timestamp as the last update timestamp in
          instance storage.
      oracle/src/prices.rs::get_history_map:
        sentinel_values: Returns an empty Bytes if no history map is stored in instance
          storage.
      oracle/src/prices.rs::update_history_mask:
        vector_params: Accepts prices as Vec<i128>; inserts empty zero-filled Vec
          entries for each missing interval between last_timestamp and the new timestamp.
        time_dependent: Computes update_delta from (timestamp - last_timestamp) /
          resolution and fills missing intervals before updating the history mask.
        sentinel_values: Uses 0i128 as placeholder prices for missing interval entries.
      oracle/src/prices.rs::has_price: {}
      oracle/src/prices.rs::load_history_record:
        time_dependent: Looks up a PriceUpdate by exact timestamp, first in the instance
          cache, then in temporary storage.
        sentinel_values: Returns None if no record is found in either the cache or
          temporary storage.
      oracle/src/prices.rs::store_prices:
        vector_params: Accepts update_v1 as Vec<i128> for legacy price storage; manages
          a cache Vec of (u64, PriceUpdate) tuples bounded by cache_size, removing
          oldest entries via pop_back.
        time_dependent: Updates last_timestamp if the new timestamp is greater; computes
          ledgers_to_live from retention_period for TTL extension of temporary storage
          entries.
        sentinel_values: Minimum TTL threshold of 16 ledgers; if ledgers_to_live <=
          16, no TTL extension is performed.
      oracle/src/prices.rs::load_prices:
        vector_params: Returns Option<Vec<PriceData>> collecting price records via
          get_price_fn callback; records count is capped at 20.
        time_dependent: Iterates backward from obtain_last_record_timestamp by resolution
          steps; returns None if last record timestamp is 0.
        sentinel_values: Returns None if no prices are collected (empty result) or
          if obtain_last_record_timestamp returns 0.
      oracle/src/prices.rs::calculate_twap:
        time_dependent: Checks that the last price timestamp plus resolution plus
          60 seconds is not older than current ledger time; returns None if the data
          is stale.
        sentinel_values: Returns None if load_prices returns None, if the number of
          returned prices doesn't match the requested records, or if price data is
          too old.
      oracle/src/prices.rs::load_cross_price:
        time_dependent: Retrieves base and quote asset prices at a specific timestamp
          and computes their cross price.
        sentinel_values: Returns 10^decimals as the price when base_asset == quote_asset
          (identity price); returns None if either asset price is unavailable.
      oracle/src/prices.rs::load_price_records_cache:
        vector_params: Returns Option<Vec<(u64, PriceUpdate)>> from instance storage
          under the CACHE_KEY.
        sentinel_values: Returns None if no cache entry exists in instance storage.
      oracle/src/prices.rs::store_price_v1:
        vector_params: Iterates over updates Vec<i128>, storing each non-zero price
          in temporary storage keyed by (asset, timestamp).
        time_dependent: Extends TTL of each stored price record by ledgers_to_live
          if > 16.
        sentinel_values: Skips prices equal to 0; minimum TTL threshold of 16 ledgers
          for extension.
      oracle/src/prices.rs::get_price_v1:
        time_dependent: Loads a legacy price from temporary storage keyed by asset
          and timestamp.
        sentinel_values: Returns None if no price exists in temporary storage for
          the given key.
      oracle/src/prices.rs::format_price_key_v1:
        time_dependent: Encodes timestamp and asset index into a single u128 key by
          shifting timestamp left 64 bits and ORing with asset.
      oracle/src/prices.rs::fixed_div_floor:
        sentinel_values: Panics if dividend or divisor is <= 0 with message 'invalid
          division arguments'.
  oracle/src/protocol.rs:
