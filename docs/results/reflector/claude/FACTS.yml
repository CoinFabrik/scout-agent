      oracle/src/protocol.rs::get_protocol_version:
        sentinel_values: Returns 1 as default if no protocol version is stored (unwrap_or(1)).
      oracle/src/protocol.rs::set_protocol_version: {}
      oracle/src/protocol.rs::at_latest_protocol_version:
        time_dependent: Delegates to schedule_update which compares ledger timestamp
          against a stored upgrade timestamp plus a 1-day delay.
      oracle/src/protocol.rs::schedule_update:
        time_dependent: Uses ledger_timestamp and a 1-day (milliseconds) delay; upgrade
          executes only after scheduled_update_ts + 1 day < ledger_timestamp.
        sentinel_values: scheduled_update_ts defaults to 0 via unwrap_or(0); 0 means
          no upgrade is scheduled yet; reset to 0 after upgrade completes.
      oracle/src/protocol.rs::set_protocol_upgrade_timestamp:
        time_dependent: Stores a u64 timestamp used for scheduling protocol upgrades.
        sentinel_values: A value of 0 is used to indicate no upgrade is scheduled.
